<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#101a1e"/>
<title>MYON v0.07.02</title>
<style>
:root{color-scheme:dark;--bg:#0e171b;--surface:#142328;--surface-2:#192c30;--edge:#2b4240;--muted:#91aaa3;--text:#e7f1ec;--green:#ade8c0;--accent:#1f4b35}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#0b1217;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{cursor:default;opacity:.5}
.viewport{min-height:100dvh;display:flex;justify-content:center;align-items:stretch}.app{width:100%;max-width:450px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px #0005}
@media(min-width:600px){.viewport{padding:22px 0}.app{min-height:calc(100dvh - 44px);max-height:calc(100dvh - 44px);border:1px solid var(--edge);border-radius:19px}}
.topbar{height:61px;min-height:61px;padding:0 21px;border-bottom:1px solid var(--edge);background:#102025;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:850;letter-spacing:.095em}.logo{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#b2e7c3;color:#153522;font-size:19px;font-weight:950;letter-spacing:0}.top-right{font-size:11px;color:#8fb4a0;letter-spacing:.06em}
.content{flex:1;min-height:0;overflow:auto;padding:18px 17px 26px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.section-title{margin:21px 0 10px;font-size:12px;font-weight:800;color:#a1bbae}
.card{border:1px solid var(--edge);border-radius:13px;background:var(--surface);padding:17px 16px}.money-label{font-size:12px;color:#a5bcb0}.money-value{font-size:31px;letter-spacing:-.03em;font-weight:850;color:#b5eac7;margin:0;font-variant-numeric:tabular-nums}
.status-title{font-size:14px;font-weight:750}.status-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.bottom{height:71px;min-height:71px;border-top:1px solid var(--edge);background:#112024;display:grid;grid-template-columns:repeat(3,1fr);padding:4px 10px max(9px,env(safe-area-inset-bottom));gap:8px;align-items:stretch}.navbtn{background:transparent;border:0;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:4px;border-radius:10px;color:#90a89e;position:relative;font-size:11px;font-weight:700}.navbtn.active{color:#baedd0;background:#1c342e}.navicon{width:23px;height:23px;display:grid;place-items:center}.navicon svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.taxi-dash{padding:8px 9px 10px;background:#111e23;border-color:#2b4842;border-radius:14px;margin-bottom:9px}.taxi-meter{background:linear-gradient(165deg,#09171b,#0b181d);border:1px solid #3a6660;border-radius:11px;padding:12px 13px 12px;box-shadow:inset 0 0 0 1px #1b3633}.taxi-metrics{display:flex;align-items:center;justify-content:space-between;gap:9px;color:#c3f9e4;font-size:17px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}.taxi-price{font-size:clamp(31px,8.4vw,41px);font-weight:900;color:#83edb1;letter-spacing:-.045em;text-align:center;line-height:1.15;margin:9px 0 12px;text-shadow:0 0 9px #2edb7c18;font-variant-numeric:tabular-nums;white-space:nowrap}.taxi-progress{height:4px;overflow:hidden;border-radius:50px;background:#274743}.taxi-progress i{display:block;height:100%;width:0;background:#75e9a8;border-radius:50px;transition:width .5s linear}
@media(max-width:350px){.taxi-metrics{font-size:15px}.taxi-price{font-size:30px}.taxi-meter{padding:11px 10px}}
.claim{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:23px 17px}.taxi-symbol{display:grid;place-items:center;width:50px;height:50px;border:1px solid #3a614c;border-radius:13px;color:var(--green);background:#21402e;margin-bottom:3px}.taxi-symbol svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.claim .status-title{font-size:16px}.claim-info{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 5px;border-block:1px solid #2c4540;font-size:12px}.claim-info span{color:#a0bbae}.claim-info strong{color:#bcefcf}.claim-btn{background:#b0e6c3;color:#163223;border:0;border-radius:10px;width:100%;min-height:49px;font-size:13px;font-weight:800}.claim-btn:active{filter:brightness(.93)}
.game-settings{display:flex;flex-direction:column;gap:7px}.game-settings .status-title{font-size:14px}.game-settings .status-sub{font-size:12px}
</style>
</head>
<body>
<div class="viewport"><div class="app"><header class="topbar"><div class="brand"><span class="logo">M</span>MYON</div><span class="top-right" id="topTitle">홈</span></header><main class="content" id="screen" aria-live="polite"></main><nav class="bottom" id="bottom" aria-label="주 메뉴"></nav></div></div>
<script>
(()=>{
'use strict';
// v0.07.02: 기존 택시 운행 규칙과 저장 데이터 형식을 그대로 사용합니다.
const DB='myon-taxi-v007',OLD_DB='myon-taxi-v006';
const STORE='game',KEY='main',MAX_TAXIS=20,PRICE=30000000;
const blank=()=>({balance:0,rate:90,seq:2,cars:[]});
const firstCar=id=>({id,rate:90,initial:27000000,debt:27000000,task:null,last:null,count:0});
let state=blank(),tab='home',db=null,ready=false,writeFailed=false;
const $=id=>document.getElementById(id);
const svg=name=>{const icons={
 house:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a2 2 0 0 0 .4 2.2l-1.6 1.6a2 2 0 0 0-2.2-.4l-1.1.5-.4 2.1h-2.3l-.4-2.1-1.1-.5a2 2 0 0 0-2.2.4l-1.6-1.6a2 2 0 0 0 .4-2.2l-.5-1.1L4 13.5v-2.3l2.1-.4.5-1.1a2 2 0 0 0-.4-2.2L7.8 5.9a2 2 0 0 0 2.2.4l1.1-.5.4-2.1h2.3l.4 2.1 1.1.5a2 2 0 0 0 2.2-.4l1.6-1.6a2 2 0 0 0-.4-2.2l.5-1.1 2.1-.4v-2.3l-2.1-.4z"/>',
 car:'<path d="m5 16 1-7c.2-1 1-2 2-2h8c1 0 1.8 1 2 2l1 7H5zM7 7l1-3h8l1 3M5 16v3m14-3v3M5 12h14"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/>'};
 return '<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
};
const money=n=>Math.round(n).toLocaleString('ko-KR')+' M';
function fareFor(km){return 4800+Math.floor(Math.max(0,Math.round(km*1000)-1600)/131)*100}
function timeLeft(ms){const sec=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function newTrip(c,at=Date.now()){
 if(c.task)return;
 const km=Math.round((1+Math.random()*9)*10)/10,duration=Math.round(km*3*60000);
 c.task={km,startedAt:at,duration,end:at+duration};
}
function sanitizeTask(t,now){
 if(!t||!Number.isFinite(t.km)||t.km<1||t.km>10||!Number.isFinite(t.end)||!Number.isFinite(t.duration)||t.duration<=0)return null;
 const km=Math.round(t.km*10)/10,duration=Math.round(km*3*60000);
 if(Number.isFinite(t.startedAt)&&t.startedAt>=0&&Math.abs(t.end-t.startedAt-t.duration)<1000&&Math.abs(t.duration-duration)<1000)return {km,startedAt:t.startedAt,duration,end:t.end};
 const ratio=Math.max(0,Math.min(1,(now-(t.end-t.duration))/t.duration));
 const startedAt=now-ratio*duration;return {km,startedAt,duration,end:startedAt+duration};
}
function validate(s){
 if(!s||typeof s!=='object'||!Array.isArray(s.cars)||s.cars.length>MAX_TAXIS)return null;
 const now=Date.now();
 const cars=s.cars.map(c=>{
  if(!c||!Number.isSafeInteger(c.id)||c.id<1||!Number.isInteger(c.rate)||c.rate<0||c.rate>90||!Number.isFinite(c.initial)||c.initial<0||c.initial>PRICE||!Number.isFinite(c.debt)||c.debt<0||c.debt>c.initial)return null;
  return {...c,id:c.id,rate:c.rate,initial:c.initial,debt:c.debt,task:sanitizeTask(c.task,now),last:c.last&&Number.isFinite(c.last.received)?c.last:null,count:Number.isSafeInteger(c.count)&&c.count>=0?c.count:0};
 });
 if(cars.some(c=>!c)||new Set(cars.map(c=>c.id)).size!==cars.length||!Number.isSafeInteger(s.balance)||s.balance<0)return null;
 const nextId=Math.max(2,...cars.map(c=>c.id+1));
 // 기존의 확장 필드는 변경하지 않고, 게임 진행에 필요한 수치만 검증합니다.
 return {...s,balance:s.balance,rate:Number.isInteger(s.rate)?Math.max(0,Math.min(90,s.rate)):90,seq:Number.isSafeInteger(s.seq)&&s.seq>=nextId?s.seq:nextId,cars};
}
function readKey(database){return new Promise((resolve,reject)=>{
 const tx=database.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(KEY);
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
})}
function openDB(name,create=true){return new Promise((resolve,reject)=>{
 const req=indexedDB.open(name,1);
 req.onupgradeneeded=()=>{if(!create){req.transaction.abort();return}if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
})}
async function readExisting(name){let d=null;try{d=await openDB(name,false);return d.objectStoreNames.contains(STORE)?await readKey(d):null}catch{return null}finally{if(d)d.close()}}
function save(){if(!ready||!db)return;try{
 const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(JSON.parse(JSON.stringify(state)),KEY);
 tx.onerror=()=>{writeFailed=true;console.error('MYON 저장 오류',tx.error)};
}catch(err){writeFailed=true;console.error('MYON 저장 오류',err)}}
function settle(c){
 if(!c.task)return;
 const gross=fareFor(c.task.km),paid=Math.min(c.debt,Math.round(gross*c.rate/100));
 c.debt-=paid;const received=gross-paid;
 state.balance=Math.min(Number.MAX_SAFE_INTEGER,state.balance+received);
 c.last={fare:gross,received,city:paid,km:c.task.km,delayMinutes:0};c.count++;c.task=null;
}
function advance(now=Date.now()){
 if(!state.cars.length)return false;
 let modified=false;
 for(const c of state.cars){
  if(!c.task){newTrip(c,now);modified=true}
  let count=0;
  while(c.task&&c.task.end<=now&&count<5000){const next=c.task.end;settle(c);newTrip(c,next);modified=true;count++}
 }
 if(modified)save();return modified;
}
function liveMetrics(c,now=Date.now()){
 const t=c.task;
 if(!t)return {distance:'0.0 km',time:'00:00',fare:money(4800),progress:0};
 const progress=Math.max(0,Math.min(1,(now-t.startedAt)/t.duration));
 const remain=Math.max(0,Math.ceil(t.km*(1-progress)*10-1e-8)/10);
 return {distance:remain.toFixed(1)+' km',time:timeLeft(t.end-now),fare:money(fareFor(t.km*progress)),progress:progress*100};
}
function liveCard(c){const m=liveMetrics(c);return `<section class="card taxi-dash" aria-label="택시 ${c.id}호차 미터기"><div class="taxi-meter"><div class="taxi-metrics"><span data-live="distance" data-car="${c.id}" aria-label="남은 거리">${m.distance}</span><span data-live="time" data-car="${c.id}" aria-label="남은 시간">${m.time}</span></div><div class="taxi-price" data-live="fare" data-car="${c.id}" aria-label="현재 요금">${m.fare}</div><div class="taxi-progress" aria-label="운행 진행률"><i data-live-bar data-car="${c.id}" style="width:${m.progress}%"></i></div></div></section>`}
function updateLive(){
 if(!ready)return;
 const settled=advance(Date.now());if(settled){render();return}
 for(const c of state.cars){
  const m=liveMetrics(c);
  for(const key of ['distance','time','fare'])for(const el of document.querySelectorAll('[data-live="'+key+'"][data-car="'+c.id+'"]'))if(el.textContent!==m[key])el.textContent=m[key];
  for(const el of document.querySelectorAll('[data-live-bar][data-car="'+c.id+'"]'))el.style.width=m.progress.toFixed(2)+'%';
 }
 for(const el of document.querySelectorAll('[data-live="balance"]'))if(el.textContent!==money(state.balance))el.textContent=money(state.balance);
}
function home(){
 return `<div class="card"><div class="money-value" data-live="balance">${money(state.balance)}</div></div>`+
 (state.cars.length?'<div class="section-title">운영 현황</div>'+state.cars.map(liveCard).join(''):'');
}
function operations(){
 if(!state.cars.length)return `<div class="section-title" style="margin-top:0">택시</div><div class="card claim"><div class="taxi-symbol">${svg('car')}</div><div class="status-title">택시 차량 지원</div><div class="status-sub">첫 차량은 시 지원금 90%를 지원받을 수 있습니다.</div><div class="claim-info"><span>차량 가격</span><strong>${money(PRICE)}</strong></div><div class="claim-info"><span>시 지원금</span><strong>${money(27000000)}</strong></div><button class="claim-btn" data-action="claim-first-car">택시 차량 지원받기</button></div>`;
 return `<div class="section-title" style="margin-top:0">택시 · ${state.cars.length}대 운행 중</div>`+state.cars.map(liveCard).join('');
}
function settings(){return `<div class="card game-settings"><div class="status-title">MYON</div><div class="status-sub">게임 버전 v0.07.02</div></div>`}
function nav(){return [['home','house','홈'],['operations','briefcase','운영'],['settings','settings','설정']].map(([id,icon,label])=>`<button class="navbtn ${tab===id?'active':''}" data-tab="${id}" aria-current="${tab===id?'page':'false'}"><span class="navicon">${svg(icon)}</span>${label}</button>`).join('')}
function render(){
 $('screen').innerHTML=tab==='home'?home():tab==='operations'?operations():settings();
 $('bottom').innerHTML=nav();$('topTitle').textContent=tab==='home'?'홈':tab==='operations'?'운영':'설정';
}
function switchTab(next){if(!['home','operations','settings'].includes(next))return;tab=next;render();updateLive();$('screen').scrollTop=0}
function action(act){if(!ready)return;
 if(act==='claim-first-car'&&!state.cars.length){
  const id=state.seq>2?state.seq:1;
  const c=firstCar(id);newTrip(c);state.cars.push(c);state.seq=Math.max(state.seq,id+1);save();
  render();updateLive();
 }
}
async function boot(){try{
 db=await openDB(DB,true);let saved=await readKey(db);
 if(saved===undefined||saved===null)saved=await readExisting(OLD_DB);
 if(saved!==undefined&&saved!==null){const normalized=validate(saved);if(!normalized)throw new Error('저장 데이터 형식을 확인할 수 없습니다');state=normalized}
 ready=true;const changed=advance(Date.now());if(!changed)save();render();updateLive();
}catch(err){console.error('MYON 데이터 불러오기 오류',err);$('screen').textContent='저장 데이터를 불러올 수 없습니다. 새로고침해서 다시 시도해 주세요.';}}
document.addEventListener('click',event=>{
 const btn=event.target.closest('button[data-action],button[data-tab]');if(!btn||!ready)return;
 if(btn.dataset.tab)switchTab(btn.dataset.tab);else action(btn.dataset.action);
});
boot();setInterval(updateLive,500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateLive()});
})();
</script>
</body>
</html>

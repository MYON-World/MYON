<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e171b">
<title>MYON v0.13.15</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#0b1217;color:#edf5f0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b1217}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #8bdec3;outline-offset:2px}
.viewport{min-height:100dvh;display:flex;justify-content:center}
.app{background:#0e171b;width:100%;max-width:450px;height:100dvh;height:100svh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.viewport{padding:20px 0}.app{height:calc(100dvh - 40px);border:1px solid #304448;border-radius:16px;box-shadow:0 0 35px #0005}}
.topbar{position:relative;background:#14242a;border-bottom:1px solid #2c4346;height:77px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 17px}
.brand{font-size:20px;font-weight:800;letter-spacing:.01em}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-date{color:#9bb9af;font:400 11px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.055em}
.clock-time{font:700 31px/1.12 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.015em;color:#c2ebd0}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;padding:12px}
.content::-webkit-scrollbar{display:none;width:0;height:0}
.slot-list{display:flex;flex-direction:column;gap:8px}
.slot{position:relative;overflow:hidden;background:#19292e;border:1px solid #30484a;border-radius:10px;padding:9px 11px 11px;min-height:52px;flex:none}
.slot-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.slot-name{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.slot-name strong{font-size:13px;font-weight:750;letter-spacing:-.2px}
.slot-icon{font-size:15px;line-height:1}
.slot-level{font-size:10px;color:#9eb6b2;font-variant-numeric:tabular-nums}
.slot-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.slot-state{background:#174d3c;border-radius:5px;padding:5px 8px;font-size:11px;color:#9ae7c6;font-weight:650;white-space:nowrap}
.slot-button{border:1px solid #467585;border-radius:6px;height:30px;padding:0 10px;background:#253942;color:#d1eff1;font-size:11px;font-weight:700;white-space:nowrap}
.slot-button:active{filter:brightness(.82)}
.slot-details{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-variant-numeric:tabular-nums}
.slot-metric{font-size:17px;font-weight:770;letter-spacing:-.4px;white-space:nowrap}
.slot-operations{color:#9ae7c6;font-size:11px;letter-spacing:0}
.slot-progress{position:absolute;bottom:0;left:0;height:3px;width:0%;background:#62b7ec}
.supply{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#19292e;border:1px solid #30484a;border-radius:9px;padding:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.supply-label{font-size:12px;color:#aac3b9}
.supply-time{font:750 16px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:#c2ebd0;white-space:nowrap}
@media(max-width:360px){.clock-time{font-size:27px}.brand{font-size:18px}.slot{padding:8px 9px 10px}.slot-name strong{font-size:12px}.slot-button{font-size:10px;padding:0 7px}.slot-metric{font-size:16px}.slot-state{font-size:10px;padding:5px 6px}}

/* v0.12.04: compact timetable-based bus/rail cards */
.slot-state.waiting{background:#293a3f;color:#c1cfca}
.route-info{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0 8px;color:#9bb5b0;font-size:10px}
.route-info span:last-child{white-space:nowrap}
.route-row{display:grid;grid-template-columns:75px minmax(0,1fr);align-items:center;column-gap:10px}
.route-heading{border-top:1px solid #304448;border-bottom:1px solid #304448;color:#8daaa2;font-size:10px;padding:7px 0}
.route-heading span:last-child{text-align:right}
.route-vehicles{max-height:155px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.route-vehicles::-webkit-scrollbar{display:none;width:0;height:0}
.route-vehicle{min-height:35px;padding:9px 0;border-bottom:1px solid #2b4043;font-variant-numeric:tabular-nums}
.route-vehicle:last-child{border-bottom:0}
.route-depart{font-size:11px;color:#c2d5cd;white-space:nowrap}
.route-position{font-size:11px;color:#e0f1e9;text-align:right;min-width:0;overflow-wrap:anywhere}
@media(max-width:360px){.route-row{grid-template-columns:60px minmax(0,1fr)}.route-position{font-size:10px}.route-info{font-size:9px}}

/* v0.13.04: construction / maintenance phase status, remaining distance, ETA. */
.construction-card .slot-progress{background:#67c2a5}
.construction-card .slot-name strong{font-size:13px}
@media(max-width:360px){.construction-card .slot-name strong{font-size:12px}}
.mission-catalog{margin-top:8px;background:#19292e;border:1px solid #30484a;border-radius:9px;overflow:hidden}
.mission-catalog-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;cursor:pointer;list-style:none;color:#e0eee7;font-size:12px;font-weight:700}
.mission-catalog-summary::-webkit-details-marker{display:none}
.mission-catalog-summary:focus-visible{outline:2px solid #8bdec3;outline-offset:-3px;border-radius:8px}
.mission-catalog-meta{display:flex;align-items:center;gap:9px;color:#9bb9af;font-size:11px;white-space:nowrap}
.mission-catalog-arrow{font-size:14px;display:inline-block;transition:transform .15s}
.mission-catalog[open] .mission-catalog-arrow{transform:rotate(180deg)}
.mission-catalog-body{border-top:1px solid #304448;padding:0 12px 12px}
.mission-catalog-group{padding:11px 0}
.mission-catalog-group+.mission-catalog-group{border-top:1px solid #2b4043}
.mission-catalog-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;color:#a8c8bc;font-size:11px}
.mission-catalog-group-head span{color:#789a90;font-size:10px}
.mission-catalog-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:8px;list-style:none;margin:0;padding:0}
.mission-catalog-item{display:flex;flex-direction:column;gap:2px;min-width:0;color:#e5f1ea;font-size:11px;line-height:1.45;overflow-wrap:anywhere}
.mission-catalog-item-note{color:#95b4a9;font-size:10px}
.mission-catalog-help{margin:6px 0 0;color:#92aca4;font-size:10px;line-height:1.55}
@media(max-width:380px){.mission-catalog-items{grid-template-columns:minmax(0,1fr)}}

.env-brand{display:flex;align-items:center;gap:7px;min-width:0}
.env-settings{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid #3a5459;background:#1b3239;border-radius:8px;color:#b8dcd2;padding:0}
.env-settings:disabled{cursor:default;opacity:.76}
.env-settings:not(:disabled):active{background:#29474a}
.env-settings svg{height:17px;width:17px}
@media(max-width:380px){.topbar{padding:0 9px;gap:6px}.clock-time{font-size:23px}.clock-date{font-size:9px}.brand{font-size:16px}.env-brand{gap:5px}.env-settings{width:26px;height:26px}}

/* v0.13.13: restored first-stage assistant analysis; observer does not occupy an actual mission slot. */
.assistant-card .slot-name strong{font-size:13px}
.assistant-card .slot-progress{background:#67c2a5}
.assistant-timer-label{font-size:12px;color:#aac3b9;font-weight:600;letter-spacing:0}
.assistant-timer{font:750 15px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace}
.assistant-counts{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:9px}
.assistant-stat{display:flex;align-items:center;justify-content:space-between;gap:5px;width:100%;background:#20353a;padding:9px 11px;border-radius:7px;min-width:0}
.assistant-stat-label{color:#b9d1c8;font-size:10px;line-height:1.4}
.assistant-stat-number{color:#d9f3e8;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.assistant-dev-tag{display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid #806a43;background:#403525;color:#f3cb84;border-radius:4px;padding:2px 5px;font-size:10px;font-weight:700;line-height:1.25;white-space:nowrap}

/* v0.13.15: assistant-gated research offers, update notices, and settings. */
.research-card .slot-progress,.notice-card .slot-progress{background:#67c2a5}
.research-card .slot-name strong,.notice-card .slot-name strong{font-size:13px}
.research-card .slot-button[hidden],.research-card .slot-state[hidden]{display:none}
.research-card .slot-name,.notice-card .slot-name{white-space:normal}
.system-tag{display:inline-flex;align-items:center;flex:none;border:1px solid #45677e;background:#253d51;color:#aed8f6;border-radius:4px;padding:2px 5px;font-size:10px;font-weight:700;line-height:1.25;white-space:nowrap}
.notice-subtitle{font-size:12px;color:#d9f3e8;font-weight:700;margin-top:9px}
.notice-list{margin:6px 0;padding-left:18px;color:#b9d1c8;font-size:11px;line-height:1.7;overflow-wrap:anywhere}
.top-version{color:#9ae7c6;font-size:11px;font-weight:750;white-space:nowrap}
.top-version[hidden]{display:none}
.settings-panel{position:absolute;top:68px;left:12px;right:12px;z-index:30;background:#19292e;border:1px solid #456269;box-shadow:0 12px 24px #0009;border-radius:9px;padding:13px}
.settings-panel[hidden]{display:none}
.settings-title{font-size:13px;font-weight:750;margin-bottom:11px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.settings-label{display:flex;flex-direction:column;gap:5px;min-width:0}
.settings-label strong{font-size:12px;color:#e3f3eb}
.settings-label small{font-size:10px;color:#9bb9af}
.settings-toggle{flex:none;border:1px solid #477c6a;background:#20513f;color:#c6f3d9;padding:7px 11px;border-radius:7px;font-size:11px;font-weight:750}
.settings-toggle[aria-pressed="false"]{border-color:#52626a;background:#293a40;color:#b9c4c5}
@media(max-width:360px){.top-version{font-size:10px}.research-card .slot-name strong,.notice-card .slot-name strong{font-size:12px}}

</style>
</head>
<body>
<div class="viewport"><div class="app">
<header class="topbar"><div class="env-brand"><strong class="brand">MYON</strong><button type="button" id="top-settings-toggle" class="env-settings" aria-label="설정 시스템 연구 후 해금" aria-expanded="false" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l.6 2.4 1.6.7 2.1-1.3 2.8 2.8-1.3 2.1.7 1.6L23 11v3l-2.5.6-.7 1.6 1.3 2.1-2.8 2.8-2.1-1.3-1.6.7L14 23h-4l-.6-2.5-1.6-.7-2.1 1.3-2.8-2.8 1.3-2.1-.7-1.6L1 14v-3l2.5-.6.7-1.6-1.3-2.1 2.8-2.8 2.1 1.3 1.6-.7z"/></svg></button><span id="top-version" class="top-version" hidden></span></div><div class="clock" aria-label="한국 표준시"><span id="clock-date" class="clock-date"></span><time id="clock-time" class="clock-time"></time></div><div id="settings-panel" class="settings-panel" hidden><div class="settings-title">설정</div><div class="settings-row"><div class="settings-label"><strong>변경기록 알림</strong><small>새 버전의 24시간 알림카드 표시</small></div><button id="notification-toggle" class="settings-toggle" type="button" aria-pressed="true">켜짐</button></div></div></header>
<main class="content">
  <div id="slot-list" class="slot-list"></div>
  <div class="supply"><span class="supply-label">다음 임무 등장</span><strong id="next-supply" class="supply-time">01:00:00</strong></div>
  <details class="mission-catalog">
    <summary class="mission-catalog-summary"><span>등장 가능한 임무</span><span class="mission-catalog-meta"><span id="mission-catalog-count">목록</span><span class="mission-catalog-arrow" aria-hidden="true">⌄</span></span></summary>
    <div class="mission-catalog-body">
      <div id="mission-catalog-list"></div>
      <p class="mission-catalog-help">임무는 매시간 랜덤으로 등장해요. 진행 중인 버스·철도 노선은 중복 배정되지 않으며, 전체 임무는 최대 30개예요.</p>
    </div>
  </details>
</main>
</div></div>

<script src="myon-v013.js?v=0.13.15"></script>

</body>
</html>

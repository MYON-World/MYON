<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e171b">
<title>MYON v0.09.01</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#0b1217;color:#edf5f0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b1217}
button{font:inherit}
button:focus-visible{outline:2px solid #a3e0bc;outline-offset:2px}
.viewport{min-height:100dvh;display:flex;justify-content:center}
.app{background:#0e171b;width:100%;max-width:450px;height:100dvh;height:100svh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.viewport{padding:20px 0}.app{height:calc(100dvh - 40px);border:1px solid #304448;border-radius:16px;box-shadow:0 0 35px #0005}}
.topbar{background:#14242a;border-bottom:1px solid #2c4346;height:77px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 17px}
.brand{font-size:20px;font-weight:800;letter-spacing:.01em}
.missions{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;padding:12px;display:flex;flex-direction:column;gap:8px}
.missions::-webkit-scrollbar{display:none;width:0;height:0}
.mission-card{background:#19292e;border:1px solid #30484a;border-radius:11px;padding:10px;min-height:59px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.mission-info{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.mission-name{font-size:13px;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.mission-status{font-size:12px;color:#a5c9b2;white-space:nowrap}
.mission-warning{font-size:12px;color:#edaa98}
.mission-start{flex:none;background:#b1e5c2;color:#183626;border:0;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:750;cursor:pointer;min-width:52px}
.mission-start:active{background:#88d3a7}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-date{color:#9bb9af;font:400 11px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.055em}
.clock-time{font:700 31px/1.12 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.015em;color:#c2ebd0;font-variant-numeric:tabular-nums}
@media(max-width:360px){.clock-time{font-size:27px}.brand{font-size:18px}}
.countdown[hidden],.mission-status[hidden],.mission-start[hidden]{display:none!important}
.countdown{flex:none;white-space:nowrap;font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;color:#b8e5c9}
.countdown.expiry{font-weight:500;color:#d4b6a0}
.warning{color:#edaa98;font-size:12px;white-space:nowrap}
.nav{flex:none;border-top:1px solid #2c4346;background:#14242a;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav button{border:0;border-radius:8px;height:40px;background:none;font-size:12px;font-weight:550;color:#738e8c}
.nav button[aria-current="page"]{background:#294a3b;color:#c2ebd0;font-weight:700}
.nav button:disabled{cursor:not-allowed;opacity:.75}
.lock{font-size:11px;margin-right:4px;filter:grayscale(1);opacity:.65}

/* v0.09.01: operating-category page. The original clock and mission-card styles stay unchanged. */
.missions[hidden],.operations[hidden]{display:none!important}
.operations{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;padding:12px;display:flex;flex-direction:column;gap:8px}
.operations::-webkit-scrollbar{display:none;width:0;height:0}
.operation-card{display:flex;align-items:center;gap:12px;width:100%;min-height:59px;padding:12px;background:#19292e;border:1px solid #30484a;border-radius:11px;color:#edf5f0;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.operation-card:disabled{cursor:not-allowed;color:#7e9591;opacity:1}
.operation-card:not(:disabled):active{background:#22373a}
.operation-card .operation-name{flex:1;min-width:0}
.operation-card .operation-status{font-size:12px;font-weight:400;white-space:nowrap;color:#7e9591}
.operation-icon{width:22px;height:22px;flex:none;stroke:#b8e5c9;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none}
.operation-card:disabled .operation-icon{stroke:#627775}
.operation-trailing{width:18px;height:18px;flex:none;stroke:#9bb9af}
.operation-card:disabled .operation-trailing{stroke:#738e8c}
.operation-subheading{font-size:14px;font-weight:650;color:#edf5f0;padding:12px 4px 4px}
.operation-notice{background:#19292e;border:1px solid #30484a;border-radius:11px;padding:14px;color:#9bb9af;font-size:13px;line-height:1.6}

/* 0.09.01 taxi board, balances and skill summaries. */
.funds-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:59px}
.funds-label{color:#9bb9af;font-size:13px;font-weight:600}
.funds-value{font-size:18px;font-weight:750;color:#c2ebd0;white-space:nowrap;font-variant-numeric:tabular-nums}
.taxi-vehicle-card{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;min-height:64px}
.taxi-card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.taxi-card-row .mission-name{flex:1;min-width:0}
.taxi-distance{font-size:12px;color:#9bb9af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxi-revenue{font-size:12px;color:#edf5f0;white-space:nowrap;font-weight:650;font-variant-numeric:tabular-nums}
.taxi-panel{background:#19292e;border:1px solid #30484a;border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:10px}
.taxi-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.taxi-label{font-size:12px;color:#9bb9af}
.taxi-value{font-size:17px;font-weight:750;color:#c2ebd0;font-variant-numeric:tabular-nums}
.taxi-meta{font-size:12px;color:#9bb9af;line-height:1.5}
.taxi-progress{height:6px;background:#304448;border-radius:10px;overflow:hidden}
.taxi-progress-fill{height:100%;width:0;background:#b1e5c2;border-radius:10px}
.taxi-action{background:#b1e5c2;color:#183626;border:0;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:750;cursor:pointer}
.taxi-action:disabled{background:#304448;color:#738e8c;cursor:not-allowed}
.taxi-action[hidden]{display:none!important}
.taxi-sell{padding:7px 10px}
.taxi-owned-list{display:flex;flex-direction:column;gap:8px}
.taxi-owned-row{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13px}
.taxi-owned-row>span:first-child{font-weight:600;white-space:nowrap}
.taxi-owned-cost{font-size:11px;color:#9bb9af;flex:1;min-width:0;text-align:right}
.taxi-skill{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.taxi-skill-name{font-size:13px;font-weight:600;color:#edf5f0}
.taxi-skill-status{font-size:11px;color:#9bb9af;text-align:right}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden">
<defs>
<symbol id="i-taxi" viewBox="0 0 24 24"><path d="M4 17V11l2-5h12l2 5v6"/><path d="M4 12h16M5 17h14M7 6l1-2h8l1 2"/><path d="M4 17v2h3v-2m10 0v2h3v-2"/><path d="M7.5 14.5h.01m9 0h.01"/></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 5h12v13H3zM15 9h4l3 4v5h-7M3 18h2"/><circle cx="7.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/></symbol>
<symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 12h14M5 16h14M8 19v2m8-2v2M8 8h.01m8 0h.01"/></symbol>
<symbol id="i-rail" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="15" rx="3"/><path d="M6 11h12M8 18l-2 3m10-3 2 3M9 15h.01m6 0h.01M9 6h6"/></symbol>
<symbol id="i-plane" viewBox="0 0 24 24"><path d="M17 21v-8l-5-3V3a2 2 0 0 0-4 0v7l-5 3v8l7-2 7 2z" transform="translate(2,0) scale(.9,1)"/></symbol>
<symbol id="i-ship" viewBox="0 0 24 24"><path d="M4 14l8-3 8 3-2 6H6l-2-6zM12 3v8M7 9h10M9 6h6M3 21c2 1 4 1 6 0 2 1 4 1 6 0 2 1 4 1 6 0"/></symbol>
<symbol id="i-rocket" viewBox="0 0 24 24"><path d="M12 3c4 2 6 6 6 11l-6 4-6-4c0-5 2-9 6-11zM6 11l-3 3 3 4m12-7 3 3-3 4M9 19l-1 3m7-3 1 3"/><circle cx="12" cy="10" r="2"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
</defs>
</svg>
<div class="viewport"><div class="app">
<header class="topbar"><strong class="brand">MYON</strong><div class="clock" aria-label="한국 표준시"><span id="clock-date" class="clock-date"></span><time id="clock-time" class="clock-time"></time></div></header>
<main class="missions" id="missions" aria-label="운영 종합판"></main>
<main class="operations" id="operations" aria-label="운영 메뉴" hidden>
<div class="operation-notice funds-panel"><span class="funds-label">공용자금</span><strong class="funds-value" id="common-balance">0 M</strong></div>
<button type="button" class="operation-card" id="operation-taxi"><svg class="operation-icon" aria-hidden="true"><use href="#i-taxi"/></svg><span class="operation-name">택시</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-chevron"/></svg></button>
<button type="button" class="operation-card" disabled aria-label="트럭 준비중"><svg class="operation-icon" aria-hidden="true"><use href="#i-truck"/></svg><span class="operation-name">트럭</span><span class="operation-status">준비중</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-lock"/></svg></button>
<button type="button" class="operation-card" disabled aria-label="버스 준비중"><svg class="operation-icon" aria-hidden="true"><use href="#i-bus"/></svg><span class="operation-name">버스</span><span class="operation-status">준비중</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-lock"/></svg></button>
<button type="button" class="operation-card" disabled aria-label="철도 준비중"><svg class="operation-icon" aria-hidden="true"><use href="#i-rail"/></svg><span class="operation-name">철도</span><span class="operation-status">준비중</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-lock"/></svg></button>
<button type="button" class="operation-card" disabled aria-label="항공 준비중"><svg class="operation-icon" aria-hidden="true"><use href="#i-plane"/></svg><span class="operation-name">항공</span><span class="operation-status">준비중</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-lock"/></svg></button>
<button type="button" class="operation-card" disabled aria-label="선박 준비중"><svg class="operation-icon" aria-hidden="true"><use href="#i-ship"/></svg><span class="operation-name">선박</span><span class="operation-status">준비중</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-lock"/></svg></button>
<button type="button" class="operation-card" disabled aria-label="우주 준비중"><svg class="operation-icon" aria-hidden="true"><use href="#i-rocket"/></svg><span class="operation-name">우주</span><span class="operation-status">준비중</span><svg class="operation-icon operation-trailing" aria-hidden="true"><use href="#i-lock"/></svg></button>
</main>
<main class="operations" id="taxi-operations" aria-label="택시 운영" hidden>
<button type="button" class="operation-card" id="taxi-back"><svg class="operation-icon" aria-hidden="true"><use href="#i-back"/></svg><span class="operation-name">운영</span></button>
<div class="operation-subheading">택시</div>
<section class="taxi-panel" aria-label="택시 분야 레벨">
  <div class="taxi-panel-head"><span class="taxi-label">택시 분야 레벨</span><strong class="taxi-value" id="taxi-level">Lv.1</strong></div>
  <div class="taxi-panel-head"><span class="taxi-label">경험치</span><span class="taxi-meta" id="taxi-exp">0 / 300 EXP</span></div>
  <div class="taxi-progress"><div class="taxi-progress-fill" id="taxi-exp-bar"></div></div>
  <div class="taxi-meta" id="taxi-level-info">운행 1회 +1 EXP · 레벨업 해금 24시간</div>
  <button class="taxi-action" id="taxi-level-button" type="button" hidden>레벨업 해금 시작 · 24시간</button>
</section>
<div class="operation-subheading">차량 관리</div>
<section class="taxi-panel" aria-label="택시 차량 확보">
  <div class="taxi-panel-head"><span class="taxi-label">보유 택시</span><strong class="taxi-value" id="taxi-fleet-count">0 / 30대</strong></div>
  <div class="taxi-panel-head"><span class="taxi-label">현재 차량가격</span><span class="taxi-meta" id="taxi-purchase-price">2.595 M</span></div>
  <div class="taxi-meta" id="taxi-aid">시 지원 100% · 자부담 0%</div>
  <div class="taxi-meta" id="taxi-buy-info">24시간에 1대 확보 가능</div>
  <button type="button" class="taxi-action" id="taxi-buy">차량 확보</button>
</section>
<section class="taxi-panel" aria-label="보유 택시 판매">
  <div class="taxi-panel-head"><span class="taxi-label">택시 판매</span><span class="taxi-meta">자부담 50% 회수 · 판매 제한 없음</span></div>
  <div class="taxi-owned-list" id="taxi-owned"></div>
</section>
<div class="operation-subheading">택시 스킬</div>
<section class="taxi-panel taxi-skill"><span class="taxi-skill-name">기본요금</span><span class="taxi-skill-status" id="taxi-skill-fare">기본요금 1,000원</span></section>
<section class="taxi-panel taxi-skill"><span class="taxi-skill-name">심야운행</span><span class="taxi-skill-status" id="taxi-skill-night">잠금</span></section>
<section class="taxi-panel taxi-skill"><span class="taxi-skill-name">시 지원 축소</span><span class="taxi-skill-status" id="taxi-skill-support">시 지원 100% / 10단계</span></section>
<section class="taxi-panel taxi-skill"><span class="taxi-skill-name">차량가격</span><span class="taxi-skill-status" id="taxi-skill-price">실차 가격 10% / 10단계</span></section>
</main>
<nav class="nav" aria-label="메뉴">
<button type="button" id="nav-overview" aria-current="page">운영 종합판</button>
<button type="button" id="nav-operations">운영</button>
<button type="button" disabled aria-label="메뉴 2 잠김"><span class="lock" aria-hidden="true">🔒</span>메뉴 2</button>
<button type="button" disabled aria-label="설정 잠김"><span class="lock" aria-hidden="true">🔒</span>설정</button>
</nav>
</div></div>
<script>
(function(){
 'use strict';
 const overview=document.getElementById('missions');
 const operating=document.getElementById('operations');
 const taxi=document.getElementById('taxi-operations');
 const overviewNav=document.getElementById('nav-overview');
 const operationsNav=document.getElementById('nav-operations');
 function show(view){
   overview.hidden=view!=='overview';
   operating.hidden=view!=='operations';
   taxi.hidden=view!=='taxi';
   if(view==='overview'){
     overviewNav.setAttribute('aria-current','page');
     operationsNav.removeAttribute('aria-current');
   }else{
     overviewNav.removeAttribute('aria-current');
     operationsNav.setAttribute('aria-current','page');
   }
 }
 overviewNav.addEventListener('click',()=>show('overview'));
 operationsNav.addEventListener('click',()=>show('operations'));
 document.getElementById('operation-taxi').addEventListener('click',()=>show('taxi'));
 document.getElementById('taxi-back').addEventListener('click',()=>show('operations'));
 show('overview');
})();
</script>
<script src="myon-engine.js?v=0.09.01"></script>
<script src="myon-taxi.js?v=0.09.01"></script>
</body>
</html>

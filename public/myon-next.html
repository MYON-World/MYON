<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d"><title>MYON WORLD · DEV 임무 테스트</title>
<script>
if(window.self===window.top && location.pathname.includes('/releases/')){
 const portal=new URL('../../',location.href);portal.search=location.search;portal.hash=location.hash;location.replace(portal.href);
}
</script>
<style>
:root{color-scheme:dark;--ink:#eff8ff;--soft:#a7bed2;--faint:#6788a2;--line:#335571;--blue:#9cdef8;font-family:Inter,"Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:radial-gradient(ellipse at 55% 15%,#153450 0%,#08192a 38%,#050d18 100%);color:var(--ink);-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #beeaff;outline-offset:2px}button:disabled{cursor:default;opacity:.6}
.shell{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;position:relative}
.shell:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 79% 72%,#16425d30,transparent 50%);pointer-events:none}

[hidden]{display:none!important}
/* DEV mission sandbox: text-first UI with invisible scrollbar and usable wheel/touch scrolling. */
.mw-root{width:min(1190px,100%);flex:1;min-height:0;margin:auto;display:flex;flex-direction:column;gap:13px;padding:20px clamp(13px,3.6vw,38px) 12px}
.mw-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #36536b;padding-bottom:13px}
.mw-eyebrow{font-size:10px;letter-spacing:.17em;color:#8fc9e5;font-weight:700}
.mw-head h1{font-size:clamp(23px,3vw,32px);margin:6px 0 4px;line-height:1.2}
.mw-head p{font-size:11px;color:#96b1c5;margin:0;line-height:1.6}
.mw-header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mw-cash-box{display:flex;flex-direction:column;text-align:right;gap:3px;padding-right:8px}
.mw-cash-box strong{font-size:21px;font-variant-numeric:tabular-nums}
.mw-label{font-size:10px;color:#8eb0c6}
.mw-button{background:#16364d;border:1px solid #52758e;color:#e1f2fd;border-radius:8px;font-size:11px;font-weight:700;padding:10px 12px;white-space:nowrap}
.mw-button:hover{background:#24536c;border-color:#89cce7}
.mw-restart{color:#f4c3c3;border-color:#765f66;background:#2c2632}
.mw-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;padding:0 2px 24px}
.mw-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.mw-section{padding-top:7px;padding-bottom:18px}
.mw-section+.mw-section{border-top:1px solid #304f64}
.mw-section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px}
.mw-section-title{font-size:16px;margin:0;color:#e5f5ff}
.mw-small{font-size:11px;color:#96b5c9}
.mw-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mw-card{min-width:0;border:1px solid #3b607b;background:linear-gradient(150deg,#10263a,#0b1c2c);border-radius:11px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mw-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mw-tag{font-size:10px;background:#21475f;color:#bce7f8;border:1px solid #3d708a;border-radius:5px;padding:4px 8px;font-weight:700}
.mw-tier{font-size:10px;color:#93b4c6}
.mw-name{font-size:20px;font-weight:750;margin:0;letter-spacing:-.03em}
.mw-rewards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mw-value{background:#142d41;border-radius:6px;padding:10px 11px;min-width:0;display:flex;flex-direction:column;gap:5px}
.mw-value strong{font-size:14px;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.mw-positive{color:#8cddba}.mw-negative{color:#f1a4a4}
.mw-card-bottom{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid #36536b;padding-top:11px;min-height:38px}
.mw-time,.mw-count{font-size:11px;color:#b8d6e7;font-variant-numeric:tabular-nums;white-space:nowrap}
.mw-accept{min-width:85px;background:#b0e4f6;color:#082536;border-color:#b0e4f6}
.mw-accept:hover{background:#d1f5ff}
.mw-track{height:7px;flex:1;min-width:14px;background:#274458;border-radius:8px;overflow:hidden;direction:ltr}
.mw-expire-track{height:5px;background:#31404c}
.mw-track .mw-expire-fill{background:#cf6670;transition:width .5s linear}
.mw-cost{color:#f1c79f}
.mw-fill{height:100%;background:#86d8ee;transition:width .5s}
.mw-muted{font-size:12px;color:#91adbf;padding:12px 0}
.mw-history-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:12px 0;border-bottom:1px solid #29475b}
.mw-history-title{color:#e2f4fd;font-weight:700}
.mw-history-reward{color:#9dc0d2;text-align:right;font-variant-numeric:tabular-nums}

#mw-notice{min-height:14px;font-size:11px;color:#95dacc;margin:0 0 7px}
@media(max-width:740px){.mw-root{padding:11px 12px}.mw-head{align-items:start;flex-direction:column;gap:10px}.mw-header-actions{width:100%;justify-content:flex-start}.mw-cash-box{margin-right:auto;text-align:left}.mw-cards{grid-template-columns:1fr}.mw-card{padding:13px}.mw-name{font-size:18px}.mw-rewards{gap:6px}.mw-value{padding:8px}.mw-value strong{font-size:13px}.mw-history-row{align-items:start;flex-direction:column;gap:4px}.mw-history-reward{text-align:left}}
@media(max-height:530px){.mw-head h1{font-size:20px}.mw-root{gap:6px}.mw-head{padding-bottom:7px}}



/* DEV mission cards: same five fields on desktop and mobile. */
.mw-root{gap:8px;padding-top:12px}
.mw-head{gap:10px;padding-bottom:9px}
.mw-head h1{font-size:clamp(21px,2.5vw,27px);margin:3px 0}
.mw-cash-box strong{font-size:18px}
.mw-section{padding-top:4px;padding-bottom:12px}
.mw-section-head{margin-bottom:7px}
.mw-cards{gap:8px}
.mw-card{padding:10px 12px;gap:9px;border-radius:9px}
.mw-card-top{gap:6px;align-items:center}
.mw-card-identity{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.mw-tag{font-size:9px;padding:3px 6px;white-space:nowrap}
.mw-name{font-size:15px;line-height:1.3;overflow-wrap:anywhere;margin:0}
.mw-card-controls{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.mw-tier{font-size:10px}
.mw-special{color:#efcf9c}
.mw-stage{font-size:10px;color:#7e9db2;white-space:nowrap}
.mw-time{font-size:11px;white-space:nowrap}
.mw-accept{min-width:50px;padding:6px 10px;font-size:11px;border-radius:6px}
.mw-rewards{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.mw-value{padding:6px 7px;gap:3px;border:1px solid #28465b;background:#11283a}
.mw-value .mw-label{font-size:9px;line-height:1.25;overflow-wrap:anywhere}
.mw-value strong{font-size:12px;line-height:1.2}
.mw-value .mw-unit{font-size:9px;color:#7f9bad;line-height:1.1}
.mw-value{align-items:center;text-align:center}
#mw-notice:empty{display:none}
.mw-card-bottom{border:0;padding:0;gap:7px;min-height:0}
.mw-track{height:5px}
.mw-count{font-size:10px}
.mw-card-bottom .mw-time{font-size:10px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.mw-card-bottom .mw-count{color:#c5e9f7;font-weight:700}
@media(max-width:360px){.mw-card-bottom{gap:5px}.mw-card-bottom .mw-count,.mw-card-bottom .mw-time{font-size:9px}}

@media(max-width:740px){
.mw-root{padding:8px 10px;gap:6px}
.mw-cards{grid-template-columns:1fr}
.mw-card{padding:9px;gap:7px}
.mw-card-top{flex-wrap:nowrap}
.mw-card-identity{min-width:0;flex:1}
.mw-card-controls{flex:none}
.mw-name{font-size:14px}
 .mw-rewards{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.mw-value{padding:6px 2px;min-width:0}
.mw-value strong{font-size:11px;white-space:nowrap}
.mw-history-row{align-items:start;flex-direction:column;gap:4px}
}
@media(max-width:360px){.mw-value{padding:6px 1px}.mw-value strong{font-size:9px}.mw-value .mw-label{font-size:8px}}
.mw-start-error{margin:clamp(18px,5vw,50px) auto;padding:18px;width:min(660px,calc(100% - 28px));border:1px solid #765562;background:#2a1e2c;color:#ffe3e7;border-radius:11px;font-size:13px;line-height:1.6}

/* DEV header: reuse the portal's circular M emblem, KST clock, and cash-only row. */
.top{height:70px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 clamp(14px,3.6vw,38px);background:#081b2c;border-bottom:1px solid #29445a}
.top-identity{display:flex;align-items:center;gap:10px;min-width:0}
.top-emblem{position:relative;display:grid;place-items:center;flex:none;width:44px;height:44px;border:1px solid rgba(176,225,255,.67);border-radius:50%;font:700 22px Georgia,serif;color:#d4f6ff;box-shadow:0 0 24px rgba(62,176,255,.13)}
.top-emblem:before{content:'';position:absolute;inset:14px -6px;border-top:1px solid rgba(117,218,255,.8);transform:rotate(-29deg);pointer-events:none}
.top-server{font-size:12px;font-weight:650;color:#9bd9c4;white-space:nowrap}
.top-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;white-space:nowrap}
.top-time{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums;color:#eff9ff;letter-spacing:-.035em;line-height:1.15}
.top-date{font-size:10px;letter-spacing:.04em;color:#92b3c8}
.mw-money-strip{width:100%;height:57px;flex:none;display:flex;align-items:center;background:#081b2c;border-bottom:1px solid #29445a}
.mw-money-inner{display:flex;align-items:baseline;justify-content:flex-end;gap:9px;margin:0 auto;width:min(1190px,100%);padding:0 clamp(14px,3.6vw,38px)}
.mw-money-value{color:#eff9ff;font-size:27px;line-height:1.2;letter-spacing:-.035em;font-variant-numeric:tabular-nums;font-weight:750}
.mw-money-unit{color:#9bd9c4;font-size:18px;font-weight:650}
.mw-head{justify-content:flex-end;border-bottom:0;padding-bottom:0}
.mw-header-actions{justify-content:flex-end}
@media(max-width:740px){
 .top{height:64px;padding:0 13px}
 .top-emblem{width:40px;height:40px;font-size:21px}
 .top-server{font-size:11px}
 .top-time{font-size:21px}
 .top-date{font-size:9px}
 .mw-money-strip{height:49px}
 .mw-money-inner{padding:0 13px}
 .mw-money-value{font-size:24px}
 .mw-money-unit{font-size:17px}
}
@media(max-height:520px){
 .top{height:55px}
 .top-emblem{width:36px;height:36px}
 .mw-money-strip{height:44px}
 .mw-money-value{font-size:22px}
}


/* Update panel stays collapsed and slides out from behind the money strip. */
.top{position:relative;z-index:4}
.mw-money-strip{position:relative;z-index:3;box-shadow:0 5px 12px #020e1a65}
.mw-update-reveal{display:grid;grid-template-rows:0fr;overflow:hidden;flex:none;position:relative;z-index:2;transition:grid-template-rows .55s cubic-bezier(.16,1,.3,1)}
.mw-update-reveal.is-revealed{grid-template-rows:1fr}
.mw-update-panel{min-height:0;overflow:hidden;position:relative;transform:translateY(-100%);opacity:0;background:linear-gradient(105deg,#132f43 0%,#10293c 48%,#0c2537 100%);border-bottom:1px solid #44748a;transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .38s ease}
.mw-update-reveal.is-revealed .mw-update-panel{transform:translateY(0);opacity:1}
.mw-update-accent{position:absolute;top:0;bottom:0;left:0;width:3px;background:linear-gradient(180deg,#86dbef,#448eae);box-shadow:0 0 13px #55c8f39c}
.mw-update-inner{height:36px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 7px}
.mw-update-symbol{flex:none;width:15px;height:15px;display:grid;place-items:center;border:1px solid #6aadc3;border-radius:50%;background:#1b5165}
.mw-update-symbol span{width:5px;height:5px;border-radius:50%;background:#b4edee;box-shadow:0 0 8px #6adcdc}
.mw-update-copy{font-size:11px;font-weight:600;letter-spacing:-.1px;color:#d6effb;white-space:nowrap}
.mw-update-separator{color:#679bb2;margin:0 4px}
.mw-update-restart{color:#9bd9c4}
@media(max-width:390px){.mw-update-inner{height:34px;gap:6px}.mw-update-copy{font-size:10px}.mw-update-separator{margin:0 2px}.mw-update-symbol{width:13px;height:13px}}
@media(prefers-reduced-motion:reduce){.mw-update-reveal,.mw-update-panel{transition:none}}


</style></head>
<body>
<div class="shell">
 <header class="top" aria-label="MYON 개발서버 상단 메뉴">
  <div class="top-identity"><span class="top-emblem" role="img" aria-label="MYON 엠블럼">M</span><span class="top-server">개발서버</span></div>
  <div class="top-clock" aria-label="한국 표준시간"><strong class="top-time" id="top-clock-time">--:--</strong><span class="top-date" id="top-clock-date">--.-- ---</span></div>
 </header>
 <div id="mw-money-strip" class="mw-money-strip" hidden aria-label="현재 보유 자금">
  <div class="mw-money-inner"><strong id="mw-cash" class="mw-money-value">0</strong><span class="mw-money-unit">M</span></div>
 </div>
 <div id="mw-update-reveal" class="mw-update-reveal" hidden role="status" aria-live="polite">
  <div class="mw-update-panel">
   <span class="mw-update-accent" aria-hidden="true"></span>
   <div class="mw-update-inner"><span class="mw-update-symbol" aria-hidden="true"><span></span></span><span class="mw-update-copy">신규 업데이트 적용 가능 <span class="mw-update-separator">·</span> <span class="mw-update-restart">재시작 요망</span></span></div>
  </div>
 </div>
 <section id="mw-start-error" class="mw-start-error" hidden role="alert"></section>
</div>
<script>
const params=new URLSearchParams(location.search);
const requestedDevVersion=params.get('dev_version');
const isVersionedDevSave=params.get('server')==='dev'&&/^[a-f0-9]{40}$/i.test(params.get('build')||'')&&/^\d+\.\d+\.\d+$/.test(requestedDevVersion||'');
const DEV_SAVE_VERSION=isVersionedDevSave?requestedDevVersion:'preview-0.13.86';
const topClockFormat=new Intl.DateTimeFormat('en-US',{
 timeZone:'Asia/Seoul',hourCycle:'h23',hour:'2-digit',minute:'2-digit',
 month:'2-digit',day:'2-digit',weekday:'short'
});
function updateTopClock(){
 const parts=Object.fromEntries(topClockFormat.formatToParts(new Date()).map(part=>[part.type,part.value]));
 document.getElementById('top-clock-time').textContent=parts.hour+':'+parts.minute;
 document.getElementById('top-clock-date').textContent=parts.month+'.'+parts.day+' '+parts.weekday.toUpperCase();
}
updateTopClock();
window.setInterval(updateTopClock,1000);
</script>
<script src="myon-dev-missions.js"></script>
<script src="myon-dev-update.js"></script>
</body></html>

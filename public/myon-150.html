function initial(){let city=pick(CITY).id,now=Date.now();game={schema:1,city,cash:0,createdAt:now,stats:CATALOG.map(e=>{let f=fit(city,e.categoryIndex,e.name),[a,b]=f>=1?[4500,8800]:f>=.7?[3500,8000]:f>=.2?[2000,6900]:[800,5000];return rand(a,b)/100}),offers:[],active:[],history:[],nextOfferAt:now+INTERVAL};for(let n=0;n<4;n++)game.offers.push(generate(now,true));save();}
function valid(v){return v&&v.schema===1&&CITY.some(c=>c.id===v.city)&&Number.isSafeInteger(v.cash)&&v.cash>=0&&Array.isArray(v.stats)&&v.stats.length===150&&v.stats.every(n=>Number.isFinite(n)&&n>=0&&n<=100)&&Array.isArray(v.offers)&&Array.isArray(v.active)&&Array.isArray(v.history)&&Number.isFinite(v.nextOfferAt)&&[...v.offers,...v.active].every(m=>Number.isInteger(m.field)&&m.field>=0&&m.field<150)}
function save(){try{let data=JSON.stringify(game);localStorage.setItem(SAVE,data);return localStorage.getItem(SAVE)===data}catch(e){notice='저장 실패: 브라우저 저장소를 확인하세요.';return false}}
// Discard removed features only from the newly written DEV save. Do not edit older saves.
function missionOnly(raw){
 const keepTask=task=>{
  const keys=['id','field','stage','grade','minutes','durationTicks','acceptCost','money','direct',
   'plus','minus','createdAt','expiresAt','startedAt','endsAt','mystery','completedAt'];
  return Object.fromEntries(keys.filter(k=>Object.hasOwn(task,k)).map(k=>[k,task[k]]));
 };
 return {schema:1,city:raw.city,cityName:raw.cityName,createdAt:raw.createdAt,cash:raw.cash,
  stats:raw.stats.slice(),offers:raw.offers.map(keepTask),active:raw.active.map(keepTask),
  history:raw.history.map(keepTask),nextOfferAt:raw.nextOfferAt};
}
function restore(){
 const existing=localStorage.getItem(SAVE)||localStorage.getItem(SAVE+'.backup');
 if(existing){
  const saved=JSON.parse(existing);
  if(!valid(saved))throw Error('현재 DEV 임무 기록이 손상되어 초기화를 중단했습니다.');
  game=missionOnly(saved);
  if(!save())throw Error('DEV 임무 저장 검증에 실패했습니다.');
  return;
 }
 for(const key of LEGACY_KEYS){
  const raw=localStorage.getItem(key)||localStorage.getItem(key+'.backup');
  if(!raw)continue;
  const old=JSON.parse(raw);
  if(!valid(old))throw Error('기존 DEV 임무 기록을 검증할 수 없어 초기화를 중단했습니다.');
  game=missionOnly(old);
  if(!save())throw Error('기존 DEV 임무를 새 저장소로 복사하지 못했습니다.');
  return;
 }
 initial();
}
window.MYON_SAFE_UPDATE_CHECKPOINT=async()=>!!game&&valid(game)&&save();
function clone(){return JSON.parse(JSON.stringify(game))}
function transact(fn){let orig=game;game=clone();fn(game);if(!valid(game)||!save()){game=orig;return false}return true}
const deltas=(stats,idx,v)=>stats[idx]=Math.min(100,Math.max(0,round2(stats[idx]+v)));
function settle(now){if(!game.active.some(m=>m.endsAt<=now))return false;return transact(g=>{let next=[];for(let m of g.active){if(m.endsAt>now){next.push(m);continue}let mystery={field:rand(0,149),amount:band()*(Math.random()<.5?1:-1)};deltas(g.stats,m.field,m.direct);deltas(g.stats,m.plus.field,m.plus.amount);deltas(g.stats,m.minus.field,m.minus.amount);deltas(g.stats,mystery.field,mystery.amount);g.cash+=m.money;g.history.unshift({...m,mystery,completedAt:now});}g.active=next;g.history=g.history.slice(0,40)})}
function offers(now){if(now<game.nextOfferAt&&!game.offers.some(m=>m.expiresAt<=now))return false;
 return transact(g=>{g.offers=g.offers.filter(m=>m.expiresAt>now);let t=g.nextOfferAt;if(t<now-LIFETIME)t+=Math.ceil((now-LIFETIME-t)/INTERVAL)*INTERVAL;for(;t<=now;t+=INTERVAL){if(g.offers.length<MAX_OFFERS)g.offers.push(generate(t));}if(now>=g.nextOfferAt)g.nextOfferAt+=(Math.floor((now-g.nextOfferAt)/INTERVAL)+1)*INTERVAL;if(g.cash===0&&!g.active.length&&g.offers.length&&!g.offers.some(m=>m.acceptCost===0))g.offers[0].acceptCost=0;});}
function accept(id){let m=game.offers.find(x=>x.id===id),now=Date.now();if(!m||m.expiresAt<=now)return;if(m.acceptCost>game.cash){notice='자금 부족';render();return}if(transact(g=>{let i=g.offers.findIndex(x=>x.id===id);if(i<0)return;let task=g.offers.splice(i,1)[0];g.cash-=task.acceptCost;task.startedAt=now;task.endsAt=now+task.minutes*60000;g.active.push(task)})){notice=CATALOG[m.field].name+' 임무 수락';render()}}
function countdown(ms){let sec=Math.ceil(Math.max(0,ms)/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
function card(m,active,now){let e=CATALOG[m.field],left=active?m.endsAt-now:m.expiresAt-now,duration=active?m.minutes*60000:LIFETIME,progress=Math.min(100,Math.max(0,(1-left/duration)*100));
 return `<article class="mission"><div class="top"><div class="identity"><span class="tag">${escapeHtml(e.category)}</span><span class="name">${escapeHtml(e.name)}</span></div>${active?`<span class="muted">${countdown(left)}</span>`:`<button class="btn primary tiny" data-accept="${escapeHtml(m.id)}" ${game.cash<m.acceptCost?'disabled':''}>${game.cash<m.acceptCost?'자금 부족':'수락'}</button>`}</div><div class="stats"><div class="stat"><label>수락</label><strong>${format(m.acceptCost)} M</strong></div><div class="stat"><label>보상</label><strong>${format(m.money)} M</strong></div><div class="stat"><label>기여</label><strong>${signed(m.direct)}</strong></div></div><div class="foot"><span>${active?'진행률':'유효시간'} ${active?Math.floor(progress)+'%':countdown(left)}</span><div class="track"><div class="fill" style="width:${progress}%"></div></div></div></article>`}
function render(now=Date.now()){$('cash').textContent=format(game.cash)+' M';$('city').textContent=(CITY.find(x=>x.id===game.city)?.name||game.city)+' · 임무 150개 분야 · 10분마다 새 임무';$('offer-count').textContent='('+game.offers.length+'건)';$('active-count').textContent='('+game.active.length+'건)';$('next').textContent='다음 임무 '+countdown(game.nextOfferAt-now);$('notice').textContent=notice;
 $('offers').innerHTML=game.offers.length?game.offers.map(m=>card(m,false,now)).join(''):'<div class="empty">현재 이용 가능한 임무가 없습니다.</div>';
 $('active').innerHTML=game.active.length?[...game.active].sort((a,b)=>a.endsAt-b.endsAt).map(m=>card(m,true,now)).join(''):'<div class="empty">진행 중인 임무가 없습니다.</div>';
 $('history').innerHTML=game.history.length?game.history.slice(0,5).map(m=>`<div class="history"><strong>${escapeHtml(CATALOG[m.field].name)}</strong><span>+${format(m.money)} M · 기여 ${signed(m.direct)} · ${escapeHtml(CATALOG[m.mystery.field].name)} ${signed(m.mystery.amount)}</span></div>`).join(''):'<div class="muted">완료된 임무가 없습니다.</div>';
 document.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>accept(b.dataset.accept)))}
function update(){let now=Date.now(),changed=settle(now);changed=offers(now)||changed;if(changed)notice='임무 내역이 갱신되었습니다.';render(now)}
$('restart').addEventListener('click',()=>{if(!confirm('DEV의 150개 임무 진행 기록을 초기화할까요? LIVE·TEST 및 이전 DEV 원본 세이브는 보존됩니다.'))return;localStorage.removeItem(SAVE);initial();notice='현재 DEV 임무 기록을 초기화했습니다.';render()});
const group=Array.from({length:15},(_,i)=>CATALOG.filter(x=>x.categoryIndex===i));$('fields').innerHTML=group.map((a,i)=>`<div class="fieldgroup"><h3>${i+1}. ${escapeHtml(a[0].category)}</h3><p>${a.map(x=>escapeHtml(x.name)).join(' · ')}</p></div>`).join('');
try{restore();update();setInterval(update,1000);}catch(e){$('notice').textContent='DEV 임무 시작 오류: '+String(e.message||e);console.error(e)}
</script></body></html>

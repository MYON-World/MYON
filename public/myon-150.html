<script>
const params=new URLSearchParams(location.search);
const requestedDevVersion=params.get('dev_version');
const isVersionedDevSave=params.get('server')==='dev'&&/^[a-f0-9]{40}$/i.test(params.get('build')||'')&&/^\d+\.\d+\.\d+(?:\.\d+)?$/.test(requestedDevVersion||'');
const DEV_SAVE_VERSION=isVersionedDevSave?requestedDevVersion:'preview-0.14.13';
const MYON_MISSION_SERVER=['live','test'].includes(params.get('server'))?params.get('server'):'dev';
const missionHeader=document.querySelector('.top-server');
if(MYON_MISSION_SERVER==='live')missionHeader.textContent='정식버전';
else if(MYON_MISSION_SERVER==='test')missionHeader.textContent='정식 가속버전';
const topClockFormat=new Intl.DateTimeFormat('en-US',{
 timeZone:'Asia/Seoul',hourCycle:'h23',hour:'2-digit',minute:'2-digit',
 month:'2-digit',day:'2-digit',weekday:'short'
});
function updateTopClock(){
 const parts=Object.fromEntries(topClockFormat.formatToParts(new Date()).map(part=>[part.type,part.value]));
 document.getElementById('top-clock-time').textContent=parts.hour+':'+parts.minute;
 document.getElementById('top-clock-date').textContent=parts.month+'.'+parts.day+' '+parts.weekday.toUpperCase();
}
updateTopClock();
window.setInterval(updateTopClock,1000);
</script>

"의료·복지","categoryIndex":11,"name":"노인복지"},{"category":"의료·복지","categoryIndex":11,"name":"아동복지"},{"category":"의료·복지","categoryIndex":11,"name":"장애인복지"},{"category":"의료·복지","categoryIndex":11,"name":"정신건강"},{"category":"환경·생태","categoryIndex":12,"name":"대기환경"},{"category":"환경·생태","categoryIndex":12,"name":"수질환경"},{"category":"환경·생태","categoryIndex":12,"name":"토양환경"},{"category":"환경·생태","categoryIndex":12,"name":"산림보호"},{"category":"환경·생태","categoryIndex":12,"name":"습지보호"},{"category":"환경·생태","categoryIndex":12,"name":"해양보호"},{"category":"환경·생태","categoryIndex":12,"name":"폐기물수거"},{"category":"환경·생태","categoryIndex":12,"name":"자원재활용"},{"category":"환경·생태","categoryIndex":12,"name":"기후대응"},{"category":"환경·생태","categoryIndex":12,"name":"생태복원"},{"category":"공공·안전","categoryIndex":13,"name":"행정"},{"category":"공공·안전","categoryIndex":13,"name":"재정"},{"category":"공공·안전","categoryIndex":13,"name":"세무"},{"category":"공공·안전","categoryIndex":13,"name":"경찰"},{"category":"공공·안전","categoryIndex":13,"name":"소방"},{"category":"공공·안전","categoryIndex":13,"name":"재난방재"},{"category":"공공·안전","categoryIndex":13,"name":"사법"},{"category":"공공·안전","categoryIndex":13,"name":"공공질서"},{"category":"공공·안전","categoryIndex":13,"name":"외교"},{"category":"공공·안전","categoryIndex":13,"name":"도시정책"},{"category":"정보·기술","categoryIndex":14,"name":"통신망"},{"category":"정보·기술","categoryIndex":14,"name":"인터넷"},{"category":"정보·기술","categoryIndex":14,"name":"데이터센터"},{"category":"정보·기술","categoryIndex":14,"name":"사이버보안"},{"category":"정보·기술","categoryIndex":14,"name":"소프트웨어"},{"category":"정보·기술","categoryIndex":14,"name":"인공지능"},{"category":"정보·기술","categoryIndex":14,"name":"자동화"},{"category":"정보·기술","categoryIndex":14,"name":"반도체"},{"category":"정보·기술","categoryIndex":14,"name":"로봇"},{"category":"정보·기술","categoryIndex":14,"name":"위성통신"}];
const CITY=[{id:'lien',name:'리엔시',favored:[5,6,7,8,10,11,13,14],hard:[0,1,2]},{id:'haren',name:'하렌',favored:[0,1,2,9,12],hard:[6,7,8]},{id:'serin',name:'세린시',favored:[1,6,7,8,3],hard:[0,2,9]}];
const query=new URLSearchParams(location.search);
const version=DEV_SAVE_VERSION;
if(query.get('server')&&query.get('server')!=='dev')throw Error('DEV 전용 임무 화면입니다.');
const SAVE='MYON_DEV_MISSIONS_V1_'+version,INTERVAL=600000,LIFETIME=3600000,MAX_OFFERS=10;
const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=arr=>arr[rand(0,arr.length-1)],round2=n=>Math.round((n+Number.EPSILON)*100)/100,format=n=>Number(n).toLocaleString('ko-KR');
const band=()=>{let p=Math.random()*100;let [a,b]=p<60?[1,10]:p<90?[11,30]:p<99?[31,60]:[61,100];return rand(a,b)/100};
const signed=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(2);
const fit=(city,i,name)=>{if(city==='haren'&&/연안어업|양식업|항만|여객선|해양보호|항공화물/.test(name))return .05;
 if(city==='lien'&&/연안어업|양식업|석유|천연가스/.test(name))return .05;
 if(city==='serin'&&/철광|석탄|지열|목축|조림/.test(name))return .2;
 let c=CITY.find(x=>x.id===city);return c.favored.includes(i)?1:c.hard.includes(i)?.2:.7};
const stage=n=>n>=80.01?1:n>=60.01?2:n>=40.01?3:n>=20.01?4:5;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let game=null,notice='';
function generate(time,free=false){let field=rand(0,149),e=CATALOG[field],p=Math.random()*100,grade=p<94?'일반':p<99?'극한':'리얼',minutes=grade==='일반'?rand(30,180):grade==='극한'?rand(180,360):rand(360,1440);
 return {id:'m'+time.toString(36)+Math.random().toString(36).slice(2,10),field,grade,stage:stage(game.stats[field]),minutes,acceptCost:free?0:minutes,money:minutes*100+(grade==='극한'?10000:grade==='리얼'?50000:0),direct:Math.max(.01,round2(band()*fit(game.city,e.categoryIndex,e.name))),plus:{field:rand(0,149),amount:band()},minus:{field:rand(0,149),amount:-band()},createdAt:time,expiresAt:time+LIFETIME};}
function initial(){let city=pick(CITY).id,now=Date.now();game={schema:1,city,cash:0,createdAt:now,stats:CATALOG.map(e=>{let f=fit(city,e.categoryIndex,e.name),[a,b]=f>=1?[4500,8800]:f>=.7?[3500,8000]:f>=.2?[2000,6900]:[800,5000];return rand(a,b)/100}),offers:[],active:[],history:[],nextOfferAt:now+INTERVAL,uiRion:{phase:'waiting',acceptedAt:0,completedAt:0}};for(let n=0;n<4;n++)game.offers.push(generate(now,true));save();}
function uiValid(r){return !!(r&&['waiting','pending','active','done'].includes(r.phase)&&Number.isSafeInteger(r.acceptedAt)&&r.acceptedAt>=0&&Number.isSafeInteger(r.completedAt)&&r.completedAt>=0&&(r.phase!=='active'||r.acceptedAt>0)&&(r.phase!=='done'||r.completedAt>=r.acceptedAt))}
function valid(v){return v&&v.schema===1&&CITY.some(c=>c.id===v.city)&&Number.isSafeInteger(v.cash)&&v.cash>=0&&Array.isArray(v.stats)&&v.stats.length===150&&v.stats.every(n=>Number.isFinite(n)&&n>=0&&n<=100)&&Array.isArray(v.offers)&&Array.isArray(v.active)&&Array.isArray(v.history)&&Number.isFinite(v.nextOfferAt)&&[...v.offers,...v.active].every(m=>Number.isInteger(m.field)&&m.field>=0&&m.field<150)&&(!Object.hasOwn(v,'uiRion')||uiValid(v.uiRion))}
function save(){try{let data=JSON.stringify(game);localStorage.setItem(SAVE,data);return localStorage.getItem(SAVE)===data}catch(e){notice='저장 실패: 브라우저 저장소를 확인하세요.';return false}}
// Discard removed features only from the newly written DEV save. Do not edit older saves.
function missionOnly(raw){
 const keepTask=task=>{
  const keys=['id','type','field','stage','grade','minutes','durationTicks','acceptCost','money','direct',
   'plus','minus','createdAt','expiresAt','startedAt','endsAt','mystery','completedAt'];
  return Object.fromEntries(keys.filter(k=>Object.hasOwn(task,k)).map(k=>[k,task[k]]));
 };
 return {schema:1,city:raw.city,cityName:raw.cityName,createdAt:raw.createdAt,cash:raw.cash,
  stats:raw.stats.slice(),offers:raw.offers.map(keepTask),active:raw.active.map(keepTask),
  history:raw.history.map(keepTask),nextOfferAt:raw.nextOfferAt,uiRion:raw.uiRion||{phase:'waiting',acceptedAt:0,completedAt:0}};
}
function restore(){
 const existing=localStorage.getItem(SAVE)||localStorage.getItem(SAVE+'.backup');
 if(existing){
  const saved=JSON.parse(existing);
  if(!valid(saved))throw Error('현재 DEV 임무 기록이 손상되어 초기화를 중단했습니다.');
  game=missionOnly(saved);
  if(!save())throw Error('DEV 임무 저장 검증에 실패했습니다.');
  return;
 }
 initial();
}
window.MYON_SAFE_UPDATE_CHECKPOINT=async()=>!!game&&valid(game)&&save();
function clone(){return JSON.parse(JSON.stringify(game))}
function transact(fn){let orig=game;game=clone();fn(game);if(!valid(game)||!save()){game=orig;return false}return true}
const deltas=(stats,idx,v)=>stats[idx]=Math.min(100,Math.max(0,round2(stats[idx]+v)));
function settle(now){if(!game.active.some(m=>m.endsAt<=now))return false;return transact(g=>{let next=[];for(let m of g.active){if(m.endsAt>now){next.push(m);continue}let mystery={field:rand(0,149),amount:band()*(Math.random()<.5?1:-1)};deltas(g.stats,m.field,m.direct);deltas(g.stats,m.plus.field,m.plus.amount);deltas(g.stats,m.minus.field,m.minus.amount);deltas(g.stats,mystery.field,mystery.amount);g.cash+=m.money;g.history.unshift({...m,mystery,completedAt:now});}g.active=next;g.history=g.history.slice(0,40)})}
function offers(now){if(now<game.nextOfferAt&&!game.offers.some(m=>m.expiresAt<=now))return false;
 return transact(g=>{g.offers=g.offers.filter(m=>m.expiresAt>now);let t=g.nextOfferAt;if(t<now-LIFETIME)t+=Math.ceil((now-LIFETIME-t)/INTERVAL)*INTERVAL;for(;t<=now;t+=INTERVAL){if(g.offers.length<MAX_OFFERS)g.offers.push(generate(t));}if(now>=g.nextOfferAt)g.nextOfferAt+=(Math.floor((now-g.nextOfferAt)/INTERVAL)+1)*INTERVAL;if(g.cash===0&&!g.active.length&&g.offers.length&&!g.offers.some(m=>m.acceptCost===0))g.offers[0].acceptCost=0;});}
function accept(id){let m=game.offers.find(x=>x.id===id),now=Date.now();if(!m||m.expiresAt<=now)return;if(m.acceptCost>game.cash){notice='자금 부족';render();return}if(transact(g=>{let i=g.offers.findIndex(x=>x.id===id);if(i<0)return;let task=g.offers.splice(i,1)[0];g.cash-=task.acceptCost;task.startedAt=now;task.endsAt=now+task.minutes*60000;g.active.push(task)})){notice=CATALOG[m.field].name+' 임무 수락';render()}}
function countdown(ms){let sec=Math.ceil(Math.max(0,ms)/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}

const M=60000,H=3600000;
function rionArrive(t){return game.uiRion.phase==='waiting'&&t>=game.createdAt+H?transact(g=>{g.uiRion.phase='pending'}):false}
function rionAccept(){if(game.uiRion.phase!=='pending')return false;if(!transact(g=>{g.uiRion.phase='active';g.uiRion.acceptedAt=Date.now()}))return false;notice='알 수 없는 임무 수락';render();return true}
function rionFinish(t){
 if(game.uiRion.phase!=='active'||t<game.uiRion.acceptedAt+H)return false;
 const ok=transact(g=>{g.uiRion.phase='done';g.uiRion.completedAt=t;g.history.unshift({id:'ui-rion',type:'ui-rion',completedAt:t});g.history=g.history.slice(0,40)});
 if(ok)notice='UI 리온 세팅 완료';return ok;
}
function rionStage(t){let e=t-game.uiRion.acceptedAt;return e<20*M?['??','분석중']:e<40*M?['리온','UI 리온']:['UI 리온','세팅중']}
function cell(k,value,unit,cl){return '<div class="mw-value"><span class="mw-label">'+k+'</span><strong class="'+(cl||'')+'"><span class="mw-amount">'+value+(unit?'<small class="mw-unit">'+unit+'</small>':'')+'</span></strong></div>'}
function card(m,active,t){
 const f=CATALOG[m.field],left=active?m.endsAt-t:m.expiresAt-t,p=Math.max(0,Math.min(100,(1-left/(active?m.minutes*M:LIFETIME))*100));
 const action=active?'<span class="mw-time mw-title-time">'+countdown(left)+'</span>':
 game.cash>=m.acceptCost?'<div class="mw-card-controls"><button class="mw-button mw-accept" data-accept="'+escapeHtml(m.id)+'">수락</button></div>':
 '<div class="mw-card-controls"><span class="mw-insufficient">금액 부족</span></div>';
 return '<article class="mw-card"><div class="mw-card-top"><div class="mw-card-identity"><span class="mw-tag">'+escapeHtml(f.category)+'</span><h3 class="mw-name">'+escapeHtml(f.name)+'</h3></div>'+action+'</div><div class="mw-rewards">'+cell('수락',format(m.acceptCost),'M','mw-cost')+cell('보상',format(m.money),'M')+cell('기여',signed(m.direct),'','mw-positive')+'</div><div class="mw-card-bottom"><div class="mw-track'+(active?'':' mw-expire-track')+'"><div class="mw-fill'+(active?'':' mw-expire-fill')+'" style="width:'+p+'%"></div></div>'+(active?'<span class="mw-count">'+Math.floor(p)+'%</span>':'')+'</div></article>';
}
function rionOffer(){return '<article class="mw-card"><div class="mw-card-top"><div class="mw-card-identity"><span class="mw-tag">??</span><h3 class="mw-name">알 수 없는 임무</h3></div><div class="mw-card-controls"><button id="ui-rion-accept" class="mw-button mw-accept">수락</button></div></div></article>'}
function rionCard(t){
 const e=t-game.uiRion.acceptedAt,s=rionStage(t),p=Math.max(0,Math.min(100,e/H*100));
 return '<article class="mw-card"><div class="mw-card-top"><div class="mw-card-identity"><span class="mw-tag">'+s[0]+'</span><h3 class="mw-name">'+s[1]+'</h3></div><span class="mw-time mw-title-time">'+countdown(H-e)+'</span></div><div class="mw-card-bottom"><div class="mw-track"><div class="mw-fill" style="width:'+p+'%"></div></div><span class="mw-count">'+Math.floor(p)+'%</span></div></article>';
}
function historyRows(){
 if(!game.history.length)return '<p class="mw-muted">아직 완료된 임무가 없습니다.</p>';
 return game.history.slice(0,5).map(m=>m.type==='ui-rion'?
 '<div class="mw-history-row"><span class="mw-history-title">UI 리온</span><span class="mw-history-reward">세팅 완료</span></div>':
 '<div class="mw-history-row"><span class="mw-history-title">'+escapeHtml(CATALOG[m.field]?.name||'임무')+'</span><span class="mw-history-reward">+'+format(m.money)+' M · '+signed(m.direct)+'</span></div>').join('');
}
function navDraw(t){
 const r=game?.uiRion;if(!r)return;
 const e=r.acceptedAt?t-r.acceptedAt:0,show=(r.phase==='active'||r.phase==='done')&&r.acceptedAt>0&&e>=40*M;
 const nav=$('ui-rion-nav');if(!nav)return;nav.hidden=!show;if(!show)return;
 const ratio=Math.min(1,Math.max(0,(e-40*M)/(10*M))),fill=$('ui-rion-fill'),ready=ratio>=1;
 fill.style.width=(ratio*100)+'%';$('ui-rion-shell').classList.toggle('complete',ready);
 $('ui-rion-title').textContent=ready?'리온':'메뉴 세팅중';$('ui-rion-lock').hidden=!ready;
 fill.setAttribute('aria-label',ready?'리온 메뉴, 잠김':'리온 메뉴 세팅 중');fill.disabled=true;
 const px=$('ui-rion-shell').getBoundingClientRect().width*ratio;
 fill.style.setProperty('--label-scale',String(Math.min(1,Math.max(0,px/85))));
 fill.style.setProperty('--label-opacity',String(Math.min(1,px/25)));
}
function render(t=Date.now()){
 $('cash').textContent=format(game.cash);
 $('notice').textContent=notice;
 $('offer-count').textContent=(game.offers.length+(game.uiRion.phase==='pending'?1:0))+'건';
 const q=game.active.map(m=>({id:m.id,ends:m.endsAt,task:m}));
 if(game.uiRion.phase==='active')q.push({id:'ui-rion',ends:game.uiRion.acceptedAt+H});
 q.sort((a,b)=>a.ends-b.ends||String(a.id).localeCompare(String(b.id)));
 $('active-count').textContent=q.length+'건';
 $('offers').innerHTML=game.offers.map(m=>card(m,false,t)).join('')+(game.uiRion.phase==='pending'?rionOffer():'');
 $('active').innerHTML=q.length?q.map(x=>x.task?card(x.task,true,t):rionCard(t)).join(''):'<p class="mw-muted">진행 중인 임무가 없습니다.</p>';
 $('history').innerHTML=historyRows();
 document.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click',()=>accept(b.dataset.accept)));
 const btn=$('ui-rion-accept');if(btn)btn.addEventListener('click',rionAccept);
 navDraw(t);
}
function update(){
 const t=Date.now();let changed=settle(t);
 changed=offers(t)||changed;
 changed=rionArrive(t)||changed;
 changed=rionFinish(t)||changed;
 if(changed&&!notice)notice='임무 내역이 갱신되었습니다.';
 render(t);
}
function animateNav(){if(!game)return;navDraw(Date.now());if(typeof window.requestAnimationFrame==='function')window.requestAnimationFrame(animateNav)}
try{restore();if(!uiValid(game.uiRion))throw Error('UI 리온 기록 오류');update();window.setInterval(update,1000);if(typeof window.requestAnimationFrame==='function')window.requestAnimationFrame(animateNav)}
catch(e){const el=$('mw-start-error');if(el){el.hidden=false;el.textContent='DEV 임무판 시작 실패 · '+String(e.message||e)}console.error(e)}

</script>
</body></html>

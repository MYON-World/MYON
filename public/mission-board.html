<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<title>MYON</title>
<style>
:root{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{background:#0a0f15;color:#e7edea;font-family:Inter,Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.board-header{height:80px;background:#101a20;border-bottom:1px solid #273838;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 clamp(14px,3vw,30px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{flex:0 0 auto;width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#b7e8cc;color:#152a21;font-weight:900}.brand strong{font-size:17px;letter-spacing:.12em}.kst{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}.kst-date{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.055em;color:#9db5ad}.kst-time{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:29px;letter-spacing:.055em;font-weight:850;color:#d5fce5;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(149,239,195,.12)}
.board-content{padding:15px clamp(10px,2vw,28px) 40px;width:100%;margin:0 auto}
.receive{display:flex;flex-direction:column;gap:9px;margin:0 0 18px}
.receive-button{width:100%;height:50px;border:1px solid #9edab8;background:#abdac1;color:#0d2419;font-weight:800;font-size:15px;letter-spacing:-.02em;border-radius:10px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:transform .13s,background .13s,opacity .13s}
.receive-button:active:not(:disabled){transform:scale(.992);background:#90c9aa}.receive-button:disabled{opacity:.5;cursor:default}
.receive-button .icon{height:17px;width:17px;display:inline-grid;place-items:center}
.receive-actions{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px}
.auto-button{min-width:0;border:1px solid #3d5a51;background:#172923;color:#b8cdc3;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;letter-spacing:-.02em;transition:background .15s,border-color .15s,color .15s}
.auto-button:active{transform:scale(.98)}
.auto-button.active{border-color:#8dc6a7;background:#254d3b;color:#c8ffdb}
.auto-button:focus-visible,.receive-button:focus-visible{outline:2px solid #9decc1;outline-offset:3px}

.stage{position:relative;border:1px solid #4b7668;background:linear-gradient(120deg,#18352c,#122a2b);border-radius:10px;min-height:96px;padding:19px 15px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage[hidden]{display:none}
.stage.is-scanning::before{content:'';position:absolute;inset:0;background:linear-gradient(95deg,transparent 15%,rgba(149,239,195,.14) 48%,transparent 80%);transform:translateX(-120%);animation:scan 1.05s linear infinite}
@keyframes scan{to{transform:translateX(120%)}}
.scanning{position:relative;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.scan-line{font-variant-numeric:tabular-nums;color:#afd7c4;letter-spacing:.15em;font-size:12px;font-weight:750}.scan-dots{display:inline-block;min-width:22px;text-align:left}
.scan-track{width:min(240px,85%);height:3px;background:#36554a;border-radius:4px;overflow:hidden}
.scan-fill{width:100%;height:100%;transform-origin:left center;background:#a7ebbf;transform:scaleX(0);transition:transform .12s linear}
.revealed{display:flex;align-items:center;gap:11px;width:100%;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(6px);filter:blur(4px)}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
.revealed-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.revealed .domain{align-self:flex-start}.revealed-title{font-size:17px;font-weight:800;overflow-wrap:anywhere;line-height:1.35;letter-spacing:-.03em}.revealed-time{font-size:14px;font-weight:780;color:#c9f9db;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage-meter{position:absolute;bottom:0;left:0;height:3px;background:#a7ebbf;width:100%;transform-origin:left;transition:transform .12s linear}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding:0 2px}.list-head strong{font-size:15px}.list-head span{font-size:11px;color:#8ba098}.mission-list{display:flex;flex-direction:column;gap:7px;width:100%}.mission-row{border:1px solid #273b3e;background:#131e26;border-radius:9px;padding:14px 16px;display:flex;align-items:center;gap:10px;min-width:0;min-height:57px;animation:enter-row .26s ease-out both}.mission-row:not(.new-row){animation:none}
@keyframes enter-row{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.domain{font-size:11px;font-weight:750;white-space:nowrap;color:#c1decf;background:#254638;border-radius:5px;padding:5px 7px;flex:0 0 auto}.mission-name{min-width:0;flex:1;overflow-wrap:anywhere;font-size:13px;font-weight:620;letter-spacing:-.02em}.remaining{white-space:nowrap;flex:0 0 auto;font-size:13px;font-weight:730;color:#d8eee3;font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:35px 12px;text-align:center;border:1px dashed #324642;color:#93a59e;font-size:13px;border-radius:9px}.warning{font-size:12px;padding:12px 14px;margin-top:16px;border:1px solid #85534d;border-radius:8px;background:#342520;color:#ffd3c8}
@media(max-width:500px){.board-header{height:78px;padding:0 12px}.brand{gap:6px}.mark{width:27px;height:27px}.brand strong{font-size:14px}.kst-date{font-size:11px}.kst-time{font-size:27px}.board-content{padding:12px 9px 35px}.receive-button{height:49px}.stage{min-height:94px;padding:16px 12px}.revealed-title{font-size:15px}.revealed-time{font-size:12px}.mission-row{gap:7px;padding:12px 10px;min-height:53px}.domain{font-size:10px;padding:5px 6px}.mission-name{font-size:12px}.remaining{font-size:12px}}
@media(max-width:360px){.receive-actions{grid-template-columns:minmax(0,1fr) 93px}.auto-button{font-size:12px}.mission-row{gap:5px;padding-left:7px;padding-right:7px}.remaining{font-size:11px}.revealed{gap:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="board-header"><div class="brand"><span class="mark">M</span><strong>MYON</strong></div><time class="kst" id="clock"><span class="kst-date" id="clock-date">----.--.--</span><span class="kst-time" id="clock-time">--:--</span></time></header>
<main class="board-content">
  <section class="receive" aria-label="임무 받기">
    <div class="receive-actions">
      <button type="button" id="receive-button" class="receive-button"><span class="icon">＋</span><span id="receive-label">임무 받기</span></button>
      <button type="button" id="auto-button" class="auto-button" aria-pressed="false">자동 OFF</button>
    </div>
    <div class="stage" id="stage" aria-live="polite" hidden></div>
  </section>
  <section aria-label="임무 목록"><div class="list-head"><strong>임무</strong><span><span id="active-count">–</span> / 20</span></div><div id="mission-list" class="mission-list"></div></section>
  <p id="warning" class="warning" role="alert" hidden></p>
</main>
<script>
'use strict';
const DB_NAME='myon-random-missions-v004-receive-preview';
const STORE='states';
const KEY='current';
const MAX_ACTIVE_MISSIONS=20;
const INITIAL_MISSIONS=10;
const SCAN_MS=1500;
const SHOW_MS=10000;
const MINUTE=60000;
const HOUR=60*MINUTE;
const DOMAINS = Object.freeze([
  { key: 'bus', name: '버스', min: 30, max: 8 * 60, jobs: ['시내버스 노선 운행', '광역버스 운행', '마을버스 운행', '전세버스 운행', '차량 정기 점검'] },
  { key: 'rail', name: '철도', min: 60, max: 30 * 60, jobs: ['일반열차 운행', '고속열차 운행', '화물열차 수송', '열차 정비', '철도 선로 점검'] },
  { key: 'air', name: '항공', min: 60, max: 24 * 60, jobs: ['국내선 항공편 운항', '국제선 항공편 운항', '항공기 정비', '공항 지상조업', '화물 항공편 운항'] },
  { key: 'sea', name: '해운', min: 120, max: 7 * 24 * 60, jobs: ['컨테이너선 운항', '연안 여객선 운항', '선박 기관 정비', '항만 화물 처리', '원양 화물 수송'] },
  { key: 'space', name: '우주', min: 4 * 60, max: 14 * 24 * 60, jobs: ['궤도 화물 수송', '우주선 시험 운항', '인공위성 정비', '우주 탐사 임무', '행성 간 항로 시험'] },
  { key: 'construction', name: '건설', min: 60, max: 10 * 24 * 60, jobs: ['도시 도로 확장 공사', '철도역 신축 공사', '교량 보수 공사', '공장 기반시설 건설', '상수도 배관 교체'] },
  { key: 'manufacturing', name: '제조', min: 30, max: 5 * 24 * 60, jobs: ['차량 부품 생산', '산업용 장비 조립', '철도차량 제작', '생산설비 정비', '건설 자재 생산'] },
  { key: 'logistics', name: '물류', min: 30, max: 5 * 24 * 60, jobs: ['지역 화물 배송', '철도차량 운송', '항공 화물 분류', '항만 컨테이너 이송', '원자재 공급'] },
  { key: 'energy', name: '에너지', min: 60, max: 7 * 24 * 60, jobs: ['발전 설비 점검', '변전소 증설', '도시 전력 공급', '태양광 설비 시공', '연료 공급'] },
  { key: 'agriculture', name: '농업', min: 60, max: 14 * 24 * 60, jobs: ['농산물 수확', '농기계 정비', '지역 식량 출하', '관개시설 정비', '작물 재배 관리'] },
  { key: 'commerce', name: '상업', min: 30, max: 3 * 24 * 60, jobs: ['상가 물품 공급', '유통센터 입고', '도매 주문 처리', '시장 시설 정비', '매장 운영 점검'] },
  { key: 'communications', name: '통신', min: 30, max: 5 * 24 * 60, jobs: ['통신망 점검', '기지국 증설', '광케이블 보수', '데이터센터 설비 점검', '도시 통신망 확장'] },
  { key: 'research', name: '연구', min: 60, max: 14 * 24 * 60, jobs: ['신형 동력장치 연구', '교통 흐름 분석', '산업용 소재 시험', '에너지 효율 실험', '자동운행 기술 검증'] },
  { key: 'environment', name: '환경', min: 30, max: 7 * 24 * 60, jobs: ['도시 폐기물 수거', '하수처리시설 정비', '대기질 관측', '재활용 자원 분류', '하천 환경 복구'] },
  { key: 'public', name: '도시행정', min: 30, max: 7 * 24 * 60, jobs: ['도시 기반시설 조사', '공공시설 안전점검', '교통 수요 조사', '개발 계획 검토', '지역 시설 운영'] },
])

const DOMAIN_LABELS = Object.freeze(Object.fromEntries(DOMAINS.map(x => [x.key, x.name])))

function random(seed, index, variant = 0) {
  let value = (seed ^ Math.imul((index + 1) | 0, 0x9e3779b9) ^ Math.imul((variant + 1) | 0, 0x85ebca6b)) >>> 0
  value = (value + 0x6d2b79f5) >>> 0
  let t = Math.imul(value ^ (value >>> 15), value | 1)
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296
}
const randInt = (seed, index, variant, min, max) => min + Math.floor(random(seed, index, variant) * (max - min + 1))

function freshSeed() {
  if (globalThis.crypto?.getRandomValues) {
    const bits = new Uint32Array(1)
    globalThis.crypto.getRandomValues(bits)
    return bits[0]
  }
  return Math.floor(Math.random() * 0x100000000)
}

function makeMission(seed, index, startedAt) {
  const category = DOMAINS[randInt(seed, index, 1, 0, DOMAINS.length - 1)]
  const title = category.jobs[randInt(seed, index, 2, 0, category.jobs.length - 1)]
  const durationMinutes = randInt(seed, index, 3, category.min, category.max)
  const durationSeconds = durationMinutes * 60
  return {
    id: `random-${seed}-${index}`,
    category: category.key,
    title,
    startedAt,
    endsAt: startedAt + durationSeconds * 1000,
    durationSeconds,
  }
}


function initialBoard(now=Date.now(),seed=freshSeed()){
 const normalized=seed>>>0;
 return {
   schemaVersion:4,createdAt:now,updatedAt:now,seed:normalized,
   generatedCount:INITIAL_MISSIONS,
   tasks:Array.from({length:INITIAL_MISSIONS},(_,i)=>makeMission(normalized,i,now)),
   staged:null,scan:null,autoEnabled:false
 };
}
function validTask(task){return !!(task&&typeof task.id==='string'&&Object.hasOwn(DOMAIN_LABELS,task.category)&&typeof task.title==='string'&&Number.isFinite(task.startedAt)&&Number.isFinite(task.endsAt)&&Number.isFinite(task.durationSeconds)&&task.durationSeconds>0&&task.endsAt===task.startedAt+task.durationSeconds*1000)}
function validLegacyBoard(data){return !!(data&&data.schemaVersion===3&&Number.isFinite(data.createdAt)&&Number.isFinite(data.updatedAt)&&Number.isInteger(data.seed)&&data.seed>=0&&data.seed<=0xffffffff&&Number.isSafeInteger(data.generatedCount)&&data.generatedCount>=0&&Array.isArray(data.tasks)&&data.tasks.length<=MAX_ACTIVE_MISSIONS&&data.tasks.every(validTask)&&(!data.staged||(validTask(data.staged.mission)&&Number.isFinite(data.staged.until))))}
function migrateBoard(data){
 if(!data)return null;
 if(validLegacyBoard(data))return {...data,schemaVersion:4,autoEnabled:false,scan:null,staged:data.staged?{...data.staged,mode:'manual'}:null};
 return data;
}
function validBoard(data){
 return !!(data&&data.schemaVersion===4&&Number.isFinite(data.createdAt)&&Number.isFinite(data.updatedAt)&&Number.isInteger(data.seed)&&data.seed>=0&&data.seed<=0xffffffff&&Number.isSafeInteger(data.generatedCount)&&data.generatedCount>=0&&Array.isArray(data.tasks)&&data.tasks.length<=MAX_ACTIVE_MISSIONS&&data.tasks.every(validTask)&&typeof data.autoEnabled==='boolean'&&(!data.scan||(Number.isFinite(data.scan.startedAt)&&['manual','auto'].includes(data.scan.mode)))&&(!data.staged||(validTask(data.staged.mission)&&Number.isFinite(data.staged.until)&&['manual','auto'].includes(data.staged.mode)))&&!(data.scan&&data.staged)&&data.tasks.length+(data.staged?1:0)<=MAX_ACTIVE_MISSIONS);
}

// 브라우저가 닫혀 있는 동안에도 종료/자동수락 이벤트를 실제 시각 순서로 계산합니다.
// 프레임 단위 반복 대신 종료·수락·배치 시점으로 점프합니다.
function advanceBoard(data,now=Date.now()){
 if(!validBoard(data))throw new Error('저장 형식 오류');
 if(now<data.updatedAt)return data;
 const next={...data,tasks:[...data.tasks]};
 let changed=false;
 let at=Math.min(now,Math.max(data.updatedAt,data.createdAt));
 let operations=0;
 const OPERATION_LIMIT=20000;
 while(true){
   const before=next.tasks.length;
   next.tasks=next.tasks.filter(m=>m.endsAt>at);
   if(next.tasks.length!==before)changed=true;

   if(next.staged&&next.staged.until<=at){
     if(next.staged.mission.endsAt>at&&next.tasks.length<MAX_ACTIVE_MISSIONS)next.tasks.push(next.staged.mission);
     next.staged=null;changed=true;
   }
   if(next.scan&&next.scan.startedAt+SCAN_MS<=at){
     const startedAt=next.scan.startedAt+SCAN_MS;
     if(!next.staged&&next.tasks.length<MAX_ACTIVE_MISSIONS){
       const mission=makeMission(next.seed,next.generatedCount,startedAt);
       next.generatedCount+=1;
       next.staged={mission,until:startedAt+SHOW_MS,mode:next.scan.mode};
     }
     next.scan=null;changed=true;
   }
   if(next.autoEnabled&&!next.scan&&!next.staged&&next.tasks.length<MAX_ACTIVE_MISSIONS){
     next.scan={mode:'auto',startedAt:at};changed=true;
   }
   if(at>=now)break;
   const future=[
     next.scan?next.scan.startedAt+SCAN_MS:Infinity,
     next.staged?next.staged.until:Infinity,
     ...next.tasks.map(m=>m.endsAt)
   ].filter(t=>t>at&&t<=now);
   if(!future.length)break;
   at=Math.min(...future);
   operations++;
   if(operations>OPERATION_LIMIT){
     // 극단적으로 오랫동안 미접속한 경우에도 화면이 멈추지 않도록
     // 오래된 활성 임무는 정리하고 현재 시점부터 재가동합니다.
     next.tasks=next.tasks.filter(m=>m.endsAt>now);
     next.staged=null;next.scan=next.autoEnabled?{mode:'auto',startedAt:now}:null;
     changed=true;
     break;
   }
 }
 return changed?{...next,updatedAt:now}:data;
}

function formatRemaining(seconds) {
  const total = Math.max(0, Math.ceil(seconds))
  const days = Math.floor(total / 86400)
  const hours = Math.floor((total % 86400) / 3600)
  const minutes = Math.floor((total % 3600) / 60)
  const secs = total % 60
  if (days) return `${days}일 ${hours}시간 ${minutes}분`
  if (hours) return `${hours}시간 ${String(minutes).padStart(2, '0')}분`
  return `${String(minutes).padStart(2, '0')}분 ${String(secs).padStart(2, '0')}초`
}

function openDb() {
  return new Promise((resolve, reject) => {
    if (!globalThis.indexedDB) return reject(new Error('이 브라우저에서는 IndexedDB를 지원하지 않습니다.'))
    const request = indexedDB.open(DB_NAME, 1)
    request.onupgradeneeded = () => request.result.createObjectStore(STORE)
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error || new Error('임무판 DB 열기 실패'))
    request.onblocked = () => reject(new Error('다른 탭에서 임무판 DB를 사용하고 있습니다.'))
  })
}

async function loadBoard() {
  const db = await openDb()
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly')
      const request = tx.objectStore(STORE).get(KEY)
      request.onsuccess = () => resolve(request.result ?? null)
      request.onerror = () => reject(request.error || new Error('임무판 불러오기 실패'))
    })
  } finally { db.close() }
}

async function saveBoard(data) {
  if (!validBoard(data)) throw new Error('올바르지 않은 임무판은 저장할 수 없습니다.')
  const db = await openDb()
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite')
      tx.objectStore(STORE).put(data, KEY)
      tx.oncomplete = () => resolve(true)
      tx.onerror = () => reject(tx.error || new Error('임무판 저장 실패'))
      tx.onabort = () => reject(tx.error || new Error('임무판 저장 취소'))
    })
  } finally { db.close() }
}


const ui={
 clock:document.getElementById('clock'),clockDate:document.getElementById('clock-date'),clockTime:document.getElementById('clock-time'),
 button:document.getElementById('receive-button'),label:document.getElementById('receive-label'),auto:document.getElementById('auto-button'),
 count:document.getElementById('active-count'),list:document.getElementById('mission-list'),stage:document.getElementById('stage'),warning:document.getElementById('warning')
};
const kstClock=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function formatKstClock(date){
 const parts=Object.fromEntries(kstClock.formatToParts(date).map(part=>[part.type,part.value]));
 return `${parts.year}.${parts.month}.${parts.day} ${parts.hour}:${parts.minute}`;
}
let board=null,lastSecond=-1,lastStructure='',lastListAt=0,saveQueue=Promise.resolve();
function warn(message){ui.warning.hidden=false;ui.warning.textContent=message}
function queueSave(snapshot){saveQueue=saveQueue.catch(()=>{}).then(()=>saveBoard(snapshot)).catch(()=>warn('저장 실패'));}
function receiveCount(){return board.tasks.length+(board.staged?1:0)}
function updateButton(){
 if(!board)return;
 const full=receiveCount()>=MAX_ACTIVE_MISSIONS;
 ui.button.disabled=!!board.scan||!!board.staged||full;
 ui.label.textContent=board.scan?'임무 탐색 중':full?'임무 목록 가득 참':'임무 받기';
 ui.auto.classList.toggle('active',board.autoEnabled);
 ui.auto.textContent=board.autoEnabled?'자동 ON':'자동 OFF';
 ui.auto.setAttribute('aria-pressed',String(board.autoEnabled));
}
function renderStage(now){
 if(board?.scan){
  ui.stage.hidden=false;ui.stage.className='stage is-scanning';
  if(!ui.stage.querySelector('.scanning')){
    ui.stage.dataset.token='';
    ui.stage.innerHTML='<div class="scanning"><div class="scan-line" id="scan-text">분야 분석 중<span class="scan-dots">···</span></div><div class="scan-track"><div id="scan-fill" class="scan-fill"></div></div></div>';
  }
  const progress=Math.min(1,Math.max(0,(now-board.scan.startedAt)/SCAN_MS));
  const fill=document.getElementById('scan-fill');if(fill)fill.style.transform=`scaleX(${progress})`;
  const msg=document.getElementById('scan-text');if(msg){const phases=['분야 분석 중','임무 시간 계산 중','임무 배정 중'];msg.firstChild.nodeValue=phases[Math.min(2,Math.floor(progress*3))]}
  return;
 }
 if(board?.staged){
  const item=board.staged.mission;
  const token='reveal:'+item.id;
  if(ui.stage.dataset.token!==token){
   ui.stage.replaceChildren();ui.stage.dataset.token=token;
   const wrapper=document.createElement('div');wrapper.className='revealed';
   const main=document.createElement('div');main.className='revealed-main';
   const tag=document.createElement('span');tag.className='domain';tag.textContent=DOMAIN_LABELS[item.category];
   const title=document.createElement('div');title.className='revealed-title';title.textContent=item.title;
   const remaining=document.createElement('time');remaining.className='revealed-time';remaining.id='stage-remaining';
   const meter=document.createElement('div');meter.className='stage-meter';meter.id='stage-meter';
   main.append(tag,title);wrapper.append(main,remaining);ui.stage.append(wrapper,meter);
  }
  ui.stage.hidden=false;ui.stage.className='stage';
  const time=document.getElementById('stage-remaining');if(time)time.textContent=formatRemaining((item.endsAt-now)/1000);
  const meter=document.getElementById('stage-meter');if(meter)meter.style.transform=`scaleX(${Math.max(0,(board.staged.until-now)/SHOW_MS)})`;
  return;
 }
 ui.stage.hidden=true;ui.stage.dataset.token='';ui.stage.replaceChildren();
}
function renderList(now){
 const sorted=[...board.tasks].sort((a,b)=>a.endsAt-b.endsAt||a.startedAt-b.startedAt);
 const structure=sorted.map(m=>m.id).join('|');
 if(structure===lastStructure){
  if(now-lastListAt<850)return;
  lastListAt=now;
  for(let i=0;i<sorted.length;i++){
   const el=ui.list.children[i]?.querySelector('.remaining');if(el)el.textContent=formatRemaining((sorted[i].endsAt-now)/1000);
  }
  return;
 }
 const oldIDs=new Set([...ui.list.children].map(x=>x.dataset.id));
 const frag=document.createDocumentFragment();
 if(!sorted.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='임무가 없습니다.';frag.append(empty)}
 for(const mission of sorted){
  const row=document.createElement('article');row.className='mission-row';row.dataset.id=mission.id;
  if(!oldIDs.has(mission.id)&&oldIDs.size)row.classList.add('new-row');
  const category=document.createElement('span');category.className='domain';category.textContent=DOMAIN_LABELS[mission.category];
  const title=document.createElement('span');title.className='mission-name';title.textContent=mission.title;
  const time=document.createElement('time');time.className='remaining';time.textContent=formatRemaining((mission.endsAt-now)/1000);
  row.append(category,title,time);frag.append(row);
 }
 ui.list.replaceChildren(frag);lastStructure=structure;lastListAt=now;
}
function render(now){
 const displayClock=formatKstClock(new Date(now));const [datePart,timePart]=displayClock.split(' ');
 ui.clockDate.textContent=datePart;ui.clockTime.textContent=timePart;ui.clock.dateTime=new Date(now).toISOString();ui.clock.setAttribute('aria-label',displayClock);
 if(!board)return;
 ui.count.textContent=receiveCount();updateButton();renderStage(now);renderList(now);
}
function tick(){
 if(!board)return;
 const now=Date.now();const next=advanceBoard(board,now);
 if(next!==board){board=next;queueSave(board)}
 const second=Math.floor(now/1000);
 if(second!==lastSecond||!!board.scan||!!board.staged||next!==board){render(now);lastSecond=second}
}
function beginReceive(){
 if(!board||board.scan||board.staged||receiveCount()>=MAX_ACTIVE_MISSIONS)return;
 const now=Date.now();
 board={...board,scan:{mode:'manual',startedAt:now},updatedAt:now};
 queueSave(board);render(now);
}
function toggleAuto(){
 if(!board)return;
 const now=Date.now();
 const enabled=!board.autoEnabled;
 board={...board,autoEnabled:enabled,
   scan:(!enabled&&board.scan?.mode==='auto')?null:board.scan,
   updatedAt:now};
 board=advanceBoard(board,now);
 queueSave(board);render(now);
}
ui.button.addEventListener('click',beginReceive);
ui.auto.addEventListener('click',toggleAuto);
async function boot(){
 try{
  const stored=await loadBoard();const migrated=migrateBoard(stored);
  if(migrated&&!validBoard(migrated)){warn('저장 데이터 형식 오류');return}
  board=advanceBoard(migrated??initialBoard(),Date.now());
  if(!stored||board!==stored)queueSave(board);
  render(Date.now());
 }catch(err){console.warn(err);warn('브라우저 저장소를 열 수 없습니다.')}
}
async function resume(){
 if(!board)return;
 try{
  await saveQueue;
  const saved=migrateBoard(await loadBoard());
  if(validBoard(saved)&&saved.updatedAt>board.updatedAt)board=saved;
 }catch{}
 tick();
}
window.setInterval(tick,120);
window.addEventListener('pageshow',resume);
window.addEventListener('focus',resume);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resume()});
boot();

</script>
</body></html>

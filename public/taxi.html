<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<title>MYON · 택시</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}body{background:#0a0f15;color:#e7edea;font:13px Inter,Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{flex:0 0 auto;height:80px;background:#101a20;border-bottom:1px solid #273838;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 clamp(12px,2vw,25px)}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;letter-spacing:.12em;font-weight:850}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#b7e8cc;color:#152a21;font-size:18px;letter-spacing:0;font-weight:900}
.clock{text-align:right;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}.clock small{display:block;color:#9db5ad;font-size:11px}.clock strong{display:block;color:#d5fce5;font-size:28px;line-height:1.1;letter-spacing:.05em}
.money{flex:0 0 auto;background:#111f25;border-bottom:1px solid #273838;padding:15px clamp(12px,2vw,25px);display:flex;align-items:center;justify-content:space-between;gap:9px}.money span{color:#9db5ad;font-weight:650}.money strong{font-size:21px;color:#c8f5d9;font-variant-numeric:tabular-nums}
.main{flex:1;min-height:0;padding:9px clamp(9px,2vw,25px) 24px;width:100%;overflow-y:auto;scrollbar-width:none}.main::-webkit-scrollbar{display:none}.stack{display:flex;flex-direction:column;gap:7px}
.menu{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:57px;width:100%;background:#111c23;color:#e7edea;border:1px solid #273b3d;border-radius:9px;padding:15px;text-align:left;font-size:14px;font-weight:750}.menu.primary{background:#173027;border-color:#426754}.chevron{font-size:23px;color:#a7dbc2;line-height:1}
.card{background:#111c23;border:1px solid #293e3c;border-radius:8px;overflow:hidden}.inner{padding:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-size:14px;font-weight:800}.dim{color:#97aca2;font-size:11px}.num{font-weight:750;font-variant-numeric:tabular-nums}.green{color:#bdebd0}
.pill{border:1px solid #4b5550;background:#293332;border-radius:5px;color:#cbdad1;padding:4px 7px;font-size:10px;font-weight:750;white-space:nowrap}.pill.paid{border-color:#427651;background:#1e4431;color:#bdf2ce}
.thin{height:4px;background:#30423e;border-radius:10px;overflow:hidden;margin-top:7px}.thin i{display:block;height:100%;background:#a4dbba;transition:width .2s;border-radius:10px}.subrow{margin-top:9px}
.actions{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:6px}.btn{min-height:37px;padding:8px 9px;border-radius:7px;border:1px solid #3f5a4e;background:#1b302a;color:#d2eade;font-weight:750;font-size:12px}.btn.mainbtn{background:#abdac1;border-color:#abdac1;color:#11261a}.btn.full{width:100%}
.panel{background:#142125;border-top:1px solid #2a4140;padding:12px;display:flex;flex-direction:column;gap:10px}.detailrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;font-size:12px}.detailrow span{color:#9eb6aa}.detailrow strong{text-align:right;font-variant-numeric:tabular-nums}
.entry{display:flex;gap:6px}.entry input{min-width:0;width:100%;flex:1;background:#0e171b;border:1px solid #35534c;color:#e6eee9;border-radius:6px;padding:9px}.entry button{border:1px solid #487459;background:#1d4230;color:#d4f5e0;border-radius:6px;padding:9px 12px;font-weight:750}
.buyhead{border:0;background:transparent;color:#e6eee9;width:100%;text-align:left;padding:14px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:750}.range{width:100%;accent-color:#a9e4be}
.footer{position:sticky;bottom:0;flex:0 0 auto;background:#0d151a;border-top:1px solid #2a4139;min-height:68px;padding:10px clamp(9px,2vw,25px) max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:7px}.footer button{min-height:42px;border:1px solid #2c4540;border-radius:8px;background:#152321;color:#d5eade;padding:9px 5px;font-size:12px;font-weight:680;white-space:nowrap}.footer .current{text-align:center;font-weight:750}
.test{margin-top:10px;border-top:1px solid #273b3d;padding:12px 3px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.testbuttons{display:flex;gap:5px;flex-wrap:wrap}.testbuttons button{background:#182820;border:1px solid #334c40;border-radius:5px;color:#bcd6c5;padding:7px 8px;font-size:11px}.message{margin-top:8px;color:#b7e6c6;font-size:11px;min-height:14px}
@media(max-width:380px){.top{height:76px}.brand{font-size:15px}.clock strong{font-size:26px}.money strong{font-size:19px}.inner{padding:11px}.pill{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="mark">M</span>MYON</div><div class="clock"><small id="myon-date">----.--.--</small><strong id="myon-clock">--:--</strong></div></header>
<div class="money"><span>현재 자금</span><strong id="balance">0 M</strong></div>
<main class="main" id="main"><div class="stack" id="content"></div></main>
<nav class="footer" aria-label="메뉴 이동"><button type="button" id="back">← 이전메뉴</button><span class="current" id="current">홈</span><button type="button" id="home">홈</button></nav>
</div>
<script>
(()=>{
'use strict';
const PRICE=30000000;
const DB='myon-taxi-v006',STORE='game',KEY='main';
const preview=new URLSearchParams(location.search).get('preview')==='1';
const $=sel=>document.querySelector(sel);
const money=n=>Math.round(n).toLocaleString('ko-KR')+' M';
const names={home:'홈',fields:'분야',transport:'교통',taxi:'택시'};
const parents={fields:'home',transport:'fields',taxi:'transport'};
const first=()=>({id:1,rate:90,initial:27000000,debt:27000000,task:null,last:null,count:0});
const blank=()=>({balance:0,rate:90,seq:2,cars:[first()]});
let state=blank(),page='home',opened=null,buyOpen=false,message='',db=null,ready=false,dirty=false;
function clock(){
 const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 $('#myon-date').textContent=p.year+'.'+p.month+'.'+p.day;
 $('#myon-clock').textContent=p.hour+':'+p.minute;
}
function openDB(){return new Promise((resolve,reject)=>{
 const request=indexedDB.open(DB,1);
 request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE);};
 request.onsuccess=()=>resolve(request.result);
 request.onerror=()=>reject(request.error);
});}
function load(){return new Promise((resolve,reject)=>{
 const tx=db.transaction(STORE,'readonly');
 const req=tx.objectStore(STORE).get(KEY);
 req.onsuccess=()=>resolve(req.result);
 req.onerror=()=>reject(req.error);
});}
function store(){
 if(!db||!ready||!dirty)return;
 dirty=false;
 try{
  const tx=db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put(JSON.parse(JSON.stringify(state)),KEY);
  tx.onerror=()=>{dirty=true;message='저장 오류: 다시 시도합니다.';};
 }catch(error){dirty=true;}
}
function changed(){dirty=true;store();}
function validate(s){
 if(!s||typeof s!=='object'||!Array.isArray(s.cars)||!s.cars.length)return blank();
 const cars=s.cars.slice(0,500).filter(c=>c&&Number.isSafeInteger(c.id)&&c.id>0&&Number.isFinite(c.debt)&&c.debt>=0&&c.debt<=PRICE&&Number.isInteger(c.rate)&&c.rate>=0&&c.rate<=90&&Number.isFinite(c.initial)&&c.initial>=0&&c.initial<=PRICE).map(c=>({
  id:c.id,rate:c.rate,initial:c.initial,debt:Math.min(c.debt,c.initial),
  task:c.task&&Number.isFinite(c.task.end)&&Number.isFinite(c.task.duration)&&c.task.duration>0&&Number.isFinite(c.task.fare)&&Number.isFinite(c.task.km)?c.task:null,
  last:c.last&&Number.isFinite(c.last.received)?c.last:null,
  count:Number.isSafeInteger(c.count)&&c.count>=0?c.count:0
 }));
 if(!cars.length)return blank();
 const ids=new Set(cars.map(c=>c.id));
 if(ids.size!==cars.length)return blank();
 return {balance:Number.isSafeInteger(s.balance)&&s.balance>=0?s.balance:0,rate:Number.isInteger(s.rate)?Math.max(0,Math.min(90,s.rate)):90,seq:Math.max(...ids)+1,cars};
}
function fareFor(km){return 4800+Math.floor(Math.max(0,Math.round(km*1000)-1600)/131)*100;}
function newTrip(c){
 if(c.task)return;
 const km=Math.round((1+Math.random()*9)*10)/10;
 const duration=4500+km*650;
 c.task={km,fare:fareFor(km),duration,end:Date.now()+duration};
 changed();
}
function settle(c){
 if(!c.task)return;
 const gross=c.task.fare;
 const paid=Math.min(c.debt,Math.round(gross*c.rate/100));
 c.debt-=paid;
 const received=gross-paid;
 state.balance+=received;
 c.last={fare:gross,received,city:paid,km:c.task.km};
 c.count++;
 c.task=null;
 if(c.debt===0)newTrip(c);
 changed();
}
function progress(c){return c.initial===0?100:(c.initial-c.debt)/c.initial*100;}
function carHTML(c){
 const paid=c.debt===0,pct=progress(c);
 const secs=c.task?Math.max(0,Math.ceil((c.task.end-Date.now())/1000)):0;
 return '<article class="card"><div class="inner">'+
 '<div class="row"><strong class="name">택시 '+c.id+'호차</strong><span class="pill '+(paid?'paid':'')+'">'+(paid?'자동운행':'수동 · 시 납부 '+c.rate+'%')+'</span></div>'+
 (paid?
 '<div class="row subrow"><span class="dim">운행 '+(c.task?c.task.km.toFixed(1)+'km':'준비 중')+' · '+c.count+'회 완료</span><span class="num green" data-timer="'+c.id+'">'+(c.task?secs+'초':'-')+'</span></div>'+
 (c.task?'<div class="thin"><i data-trip="'+c.id+'" style="width:'+Math.max(0,Math.min(100,100*(1-(c.task.end-Date.now())/c.task.duration)))+'%"></i></div>':'')+
 '<div class="row subrow"><span class="dim">최근 운행 수익</span><strong class="num green">'+(c.last?'+'+money(c.last.received):'-')+'</strong></div>'
 :
 '<div class="row subrow"><span class="dim">남은 지원금</span><strong class="num">'+money(c.debt)+'</strong></div>'+
 '<div class="thin"><i style="width:'+pct+'%"></i></div>'+
 '<div class="row subrow"><span class="dim">'+(c.task?'운행 중 · '+c.task.km.toFixed(1)+'km':'상환 '+pct.toFixed(1)+'%')+'</span><span class="num dim" data-timer="'+c.id+'">'+(c.task?secs+'초':c.last?'최근 수익 +'+money(c.last.received):'운행 대기')+'</span></div>'+
 (c.task?'<div class="thin"><i data-trip="'+c.id+'" style="width:'+Math.max(0,Math.min(100,100*(1-(c.task.end-Date.now())/c.task.duration)))+'%"></i></div>':'')+
 '<div class="actions"><button type="button" class="btn mainbtn" data-act="run" data-id="'+c.id+'" '+(c.task?'disabled':'')+'>'+(c.task?'운행 중':'수동운행')+'</button><button type="button" class="btn" data-act="expand" data-id="'+c.id+'" aria-label="상환 상세">'+(opened===c.id?'⌃':'···')+'</button></div>'
 )+
 '</div>'+
 (!paid&&opened===c.id?
 '<div class="panel"><div class="detailrow"><span>차량가격</span><strong>'+money(PRICE)+'</strong><span>시 납부율</span><strong>'+c.rate+'%</strong><span>미상환 지원금</span><strong>'+money(c.debt)+'</strong></div>'+
 '<div class="entry"><input type="number" min="1" step="1" placeholder="중도 상환금 (M)" data-pay="'+c.id+'" aria-label="택시 '+c.id+'호차 중도 상환금"><button type="button" data-act="repay" data-id="'+c.id+'">상환</button></div>'+
 '<button type="button" class="btn full" data-act="all" data-id="'+c.id+'" '+(state.balance<c.debt?'disabled':'')+'>전액 상환 · '+money(c.debt)+'</button></div>':'')+'</article>';
}
function draw(){
 $('#balance').textContent=money(state.balance);
 $('#current').textContent=names[page];
 $('#back').disabled=page==='home';
 const content=$('#content');
 if(page!=='taxi'){
  const next=page==='home'?'fields':page==='fields'?'transport':'taxi';
  content.innerHTML='<button type="button" class="menu '+(page==='home'?'primary':'')+'" data-act="nav" data-next="'+next+'"><span>'+names[next]+'</span><span class="chevron">›</span></button>';
  return;
 }
 let html=state.cars.map(carHTML).join('');
 const aid=Math.round(PRICE*state.rate/100),own=PRICE-aid;
 html+='<div class="card"><button type="button" class="buyhead" data-act="buyopen"><span>＋ 택시 추가 구매</span><span class="dim">'+(buyOpen?'⌃':'›')+'</span></button>'+
 (buyOpen?'<div class="panel"><div class="row"><span class="dim">시 지원 비율</span><strong class="green" id="rate-label">'+state.rate+'%</strong></div>'+
 '<input class="range" type="range" min="0" max="90" step="1" value="'+state.rate+'" id="rate-slider" aria-label="시 지원 비율">'+
 '<div class="detailrow"><span>차량가격</span><strong>'+money(PRICE)+'</strong><span>시 지원금</span><strong id="aid-label">'+money(aid)+'</strong><span>자기 부담금</span><strong id="own-label">'+money(own)+'</strong></div>'+
 '<button type="button" class="btn mainbtn full" data-act="purchase" id="purchase" '+(state.balance<own?'disabled':'')+'>구매 · '+money(own)+'</button></div>':'')+'</div>';
 if(preview)html+='<div class="test"><span class="dim">테스트 자금</span><div class="testbuttons"><button type="button" data-grant="3000000">+300만</button><button type="button" data-grant="30000000">+3,000만</button><button type="button" data-grant="reset">초기화</button></div></div>';
 html+='<div class="message" role="status">'+message+'</div>';
 content.innerHTML=html;
}
function go(target){if(!names[target])return;page=target;message='';draw();$('#main').scrollTop=0;}
$('#back').addEventListener('click',()=>go(parents[page]||'home'));
$('#home').addEventListener('click',()=>go('home'));
document.addEventListener('input',e=>{
 if(e.target.id!=='rate-slider')return;
 state.rate=Number(e.target.value);
 const aid=Math.round(PRICE*state.rate/100),own=PRICE-aid;
 $('#rate-label').textContent=state.rate+'%';
 $('#aid-label').textContent=money(aid);
 $('#own-label').textContent=money(own);
 const buy=$('#purchase');buy.disabled=state.balance<own;buy.textContent='구매 · '+money(own);
 changed();
});
document.addEventListener('click',e=>{
 const grant=e.target.closest('button[data-grant]');
 if(grant&&preview){
  if(grant.dataset.grant==='reset'){state=blank();opened=null;buyOpen=false;message='초기화 완료';}
  else{state.balance+=Number(grant.dataset.grant);message='테스트 자금 추가';}
  changed();draw();return;
 }
 const btn=e.target.closest('button[data-act]');if(!btn||!ready)return;
 const act=btn.dataset.act,id=Number(btn.dataset.id),c=state.cars.find(v=>v.id===id);
 if(act==='nav'){go(btn.dataset.next);return;}
 if(act==='expand'){opened=opened===id?null:id;draw();return;}
 if(act==='buyopen'){buyOpen=!buyOpen;draw();return;}
 if(act==='run'&&c&&c.debt>0&&!c.task){newTrip(c);message='';draw();return;}
 if((act==='repay'||act==='all')&&c&&c.debt>0){
  const amount=act==='all'?c.debt:Number(document.querySelector('[data-pay="'+id+'"]')?.value);
  if(!Number.isSafeInteger(amount)||amount<=0){message='상환금액을 확인해주세요.';draw();return;}
  if(amount>state.balance){message='공용 자금이 부족합니다.';draw();return;}
  const applied=Math.min(amount,c.debt);
  state.balance-=applied;c.debt-=applied;
  if(c.debt===0){opened=null;if(!c.task)newTrip(c);message='택시 '+id+'호차 완납 · 자동운행 시작';}
  else message=money(applied)+' 상환 완료';
  changed();draw();return;
 }
 if(act==='purchase'){
  const aid=Math.round(PRICE*state.rate/100),own=PRICE-aid;
  if(state.balance<own)return;
  state.balance-=own;
  const v={id:state.seq++,rate:state.rate,initial:aid,debt:aid,task:null,last:null,count:0};
  state.cars.push(v);
  if(aid===0)newTrip(v);
  buyOpen=false;message='택시 '+v.id+'호차 구매 완료'+(aid===0?' · 자동운행 시작':'');
  changed();draw();
 }
});
setInterval(()=>{
 if(!ready)return;
 const now=Date.now();let finished=false;
 for(const c of state.cars){
  if(!c.task){if(c.debt===0){newTrip(c);finished=true;}continue;}
  if(now>=c.task.end){settle(c);finished=true;}
  else if(page==='taxi'){
   const timer=document.querySelector('[data-timer="'+c.id+'"]');if(timer)timer.textContent=Math.ceil((c.task.end-now)/1000)+'초';
   const bar=document.querySelector('[data-trip="'+c.id+'"]');if(bar)bar.style.width=Math.max(0,Math.min(100,100*(1-(c.task.end-now)/c.task.duration)))+'%';
  }
 }
 if(finished)draw();
},200);
clock();setInterval(clock,15000);
(async()=>{
 try{db=await openDB();const saved=await load();if(saved)state=validate(saved);}
 catch(e){message='자동 저장을 사용할 수 없습니다.';}
 ready=true;
 for(const c of state.cars){if(c.task&&Date.now()>=c.task.end)settle(c);if(c.debt===0&&!c.task)newTrip(c);}
 draw();
})();
})();
</script>
</body>
</html>

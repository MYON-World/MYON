<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}body{background:#0a0f15;color:#e7edea;font:13px Inter,Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
.shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{flex:0 0 auto;height:80px;background:#101a20;border-bottom:1px solid #273838;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 clamp(12px,2vw,25px)}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;letter-spacing:.12em;font-weight:850}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#b7e8cc;color:#152a21;font-size:18px;letter-spacing:0;font-weight:900}
.clock{text-align:right;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}.clock small{display:block;color:#9db5ad;font-size:11px}.clock strong{display:block;color:#d5fce5;font-size:28px;line-height:1.1;letter-spacing:.05em}
.money{flex:0 0 auto;background:#111f25;border-bottom:1px solid #273838;padding:15px clamp(12px,2vw,25px);display:flex;align-items:center;justify-content:space-between;gap:9px}.money span{color:#9db5ad;font-weight:650}.money strong{font-size:21px;color:#c8f5d9;font-variant-numeric:tabular-nums}
.main{flex:1;min-height:0;padding:9px clamp(9px,2vw,25px) 24px;width:100%;overflow-y:auto;scrollbar-width:none}.main::-webkit-scrollbar{display:none}.stack{display:flex;flex-direction:column;gap:7px}
.menu{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:57px;width:100%;background:#111c23;color:#e7edea;border:1px solid #273b3d;border-radius:9px;padding:15px;text-align:left;font-size:14px;font-weight:750}.menu.primary{background:#173027;border-color:#426754}.chevron{font-size:23px;color:#a7dbc2;line-height:1}
.card{background:#111c23;border:1px solid #293e3c;border-radius:8px;overflow:hidden}.inner{padding:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-size:14px;font-weight:800}.dim{color:#97aca2;font-size:11px}.num{font-weight:750;font-variant-numeric:tabular-nums}.green{color:#bdebd0}
.pill{border:1px solid #4b5550;background:#293332;border-radius:5px;color:#cbdad1;padding:4px 7px;font-size:10px;font-weight:750;white-space:nowrap}.pill.paid{border-color:#427651;background:#1e4431;color:#bdf2ce}
.thin{height:4px;background:#30423e;border-radius:10px;overflow:hidden;margin-top:7px}.thin i{display:block;height:100%;background:#a4dbba;transition:width .2s;border-radius:10px}.subrow{margin-top:9px}.delay{color:#e8c58f}.trip{margin-top:9px;display:flex;flex-direction:column;gap:6px}.trip-label{font-size:12px;font-weight:650;min-width:0;overflow-wrap:anywhere}.trip .thin{margin-top:0}.trip-bottom{font-size:11px}.num{white-space:nowrap}
.actions{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:6px}.btn{min-height:37px;padding:8px 9px;border-radius:7px;border:1px solid #3f5a4e;background:#1b302a;color:#d2eade;font-weight:750;font-size:12px}.btn.mainbtn{background:#abdac1;border-color:#abdac1;color:#11261a}.btn.full{width:100%}
.panel{background:#142125;border-top:1px solid #2a4140;padding:12px;display:flex;flex-direction:column;gap:10px}.detailrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;font-size:12px}.detailrow span{color:#9eb6aa}.detailrow strong{text-align:right;font-variant-numeric:tabular-nums}
.entry{display:flex;gap:6px}.entry input{min-width:0;width:100%;flex:1;background:#0e171b;border:1px solid #35534c;color:#e6eee9;border-radius:6px;padding:9px}.entry button{border:1px solid #487459;background:#1d4230;color:#d4f5e0;border-radius:6px;padding:9px 12px;font-weight:750}
.buyhead{border:0;background:transparent;color:#e6eee9;width:100%;text-align:left;padding:14px 12px;display:flex;align-items:center;justify-content:space-between;font-weight:750}.range{width:100%;accent-color:#a9e4be}
.footer{position:sticky;bottom:0;flex:0 0 auto;background:#0d151a;border-top:1px solid #2a4139;min-height:68px;padding:10px clamp(9px,2vw,25px) max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:7px}.footer button{min-height:42px;border:1px solid #2c4540;border-radius:8px;background:#152321;color:#d5eade;padding:9px 5px;font-size:12px;font-weight:680;white-space:nowrap}.footer .current{text-align:center;font-weight:750}
.test{margin-top:10px;border-top:1px solid #273b3d;padding:12px 3px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.testbuttons{display:flex;gap:5px;flex-wrap:wrap}.testbuttons button{background:#182820;border:1px solid #334c40;border-radius:5px;color:#bcd6c5;padding:7px 8px;font-size:11px}.message{margin-top:8px;color:#b7e6c6;font-size:11px;min-height:14px}

/* 0.06.02: 실시간 초압축 택시 미터기 */
.taxi-card{background:#101b20;border-color:#2e4a4a;padding:6px;border-radius:14px}
.meter{background:linear-gradient(160deg,#09171b,#081216);border:2px solid #2e5758;box-shadow:inset 0 0 0 2px rgba(104,184,173,.08),0 0 12px rgba(59,140,125,.1);border-radius:13px;overflow:hidden;padding:7px 12px 9px;min-width:0}
.meter-head{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#bffce8;font-size:17px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.2}
.meter-head span{white-space:nowrap}
.meter-price{text-align:center;color:#88f6b5;text-shadow:0 0 9px rgba(79,234,149,.18);font-size:clamp(28px,7.7vw,39px);line-height:1.07;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.025em;margin:0 0 7px}
.meter-bar{margin:0;height:4px;background:#264947;border-radius:20px}
.meter-bar i{background:#66f4a4;transition:width .2s}
.support{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px 6px 1px;font-size:11px;color:#9fb9ad;font-variant-numeric:tabular-nums}
.support strong{color:#d8e9de;white-space:nowrap}
.support button{background:#203b31;border:1px solid #3e6254;color:#d0eee0;padding:5px 9px;border-radius:6px;font-weight:750}
.taxi-card .panel{margin-top:7px;border:1px solid #29433d;border-radius:8px}
@media(max-width:380px){.meter-head{font-size:15px}.meter-price{font-size:32px}.meter{padding:7px 10px 8px}}
@media(max-width:380px){.top{height:76px}.brand{font-size:15px}.clock strong{font-size:26px}.money strong{font-size:19px}.inner{padding:11px}.pill{font-size:10px}}

/* v0.07: 모바일 첫 접속 메신저 */
.intro-root{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;background:#080f14}
.intro-root[hidden]{display:none}
.intro-screen{display:flex;flex-direction:column;width:100%;max-width:520px;min-height:100vh;height:100dvh;background:#0d181f;border-inline:1px solid #253a38}
.intro-top{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:#11221f;border-bottom:1px solid #29423a}
.intro-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:850;letter-spacing:.09em}
.intro-mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#b7e8cc;color:#193225;letter-spacing:0}
.intro-sub{font-size:11px;color:#a5bfb0}
.intro-contact{display:flex;align-items:center;gap:11px;padding:13px 16px;background:#172829;border-bottom:1px solid #2d4240}
.intro-avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#315747;color:#d0f4db;font-size:19px}
.intro-person{font-size:14px;font-weight:800}
.intro-conversation{flex:1;overflow-y:auto;min-height:0;padding:20px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.intro-conversation::-webkit-scrollbar{display:none}
.intro-divider{text-align:center;color:#91a99d;font-size:11px}
.intro-bubble{max-width:86%;align-self:flex-start;background:#26393c;border:1px solid #314c4b;border-radius:5px 15px 15px 15px;padding:12px 13px;line-height:1.7;font-size:13px;white-space:pre-line;overflow-wrap:anywhere}
.intro-bubble.mine{align-self:flex-end;background:#21523c;border-color:#376f51;border-radius:15px 5px 15px 15px}
.intro-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:13px 14px max(16px,env(safe-area-inset-bottom));border-top:1px solid #2b4940;background:#14231f}
.intro-actions .intro-label{font-size:11px;color:#9eb8ab}
.intro-actions button{width:100%;min-height:46px;border:1px solid #4c8060;background:#1e3a30;border-radius:9px;color:#e1f9eb;text-align:center;font-weight:750;padding:12px 10px}
.intro-actions button:active{background:#2b6748}
.intro-actions button:last-child{background:#b1e8c5;color:#142c20;border-color:#b1e8c5}
.home-overview{padding:14px;display:flex;flex-direction:column;gap:12px}
.home-overview h2{font-size:13px;color:#b1e9c7;margin:0}
.home-overview p{font-size:12px;color:#b0c6b7;margin:0;line-height:1.55}
.home-overview .home-actions{display:grid;grid-template-columns:1fr;gap:7px}
.home-overview .home-actions button{min-height:44px;border:1px solid #496e57;border-radius:8px;background:#1b382b;color:#d6f1e2;font-weight:800}
</style>

<body>

<section class="intro-root" id="intro-root" aria-label="첫 접속 메시지" role="dialog" aria-modal="true" hidden>
 <div class="intro-screen">
  <header class="intro-top"><div class="intro-brand"><span class="intro-mark">M</span>MYON</div><span class="intro-sub">첫 접속 · 메시지</span></header>
  <div class="intro-contact"><div class="intro-avatar" aria-hidden="true">✉</div><div><div class="intro-person">운영 지원팀</div><div class="intro-sub">새 메시지가 도착했습니다</div></div></div>
  <div class="intro-conversation" id="intro-conversation" aria-live="polite" aria-relevant="additions text"></div>
  <div class="intro-actions" id="intro-actions"></div>
 </div>
</section>
<div class="shell" id="game-shell" style="visibility:hidden">
<header class="top"><div class="brand"><span class="mark">M</span>MYON</div><div class="clock"><small id="myon-date">----.--.--</small><strong id="myon-clock">--:--</strong></div></header>
<div class="money"><span>현재 자금</span><strong id="balance">0 M</strong></div>
<main class="main" id="main"><div class="stack" id="content"></div></main>
<nav class="footer" aria-label="메뉴 이동"><button type="button" id="back">← 이전메뉴</button><span class="current" id="current">홈</span><button type="button" id="home">홈</button></nav>
</div>
<script>
(()=>{
'use strict';
const PRICE=30000000,MAX_TAXIS=20;
// v0.07 신규 시작: v0.06 DB를 읽거나 삭제하지 않습니다.
const DB='myon-taxi-v007',STORE='game',KEY='main';
const $=sel=>document.querySelector(sel);
const money=n=>Math.round(n).toLocaleString('ko-KR')+' M';
const names={home:'홈',fields:'분야',transport:'교통',taxi:'택시'};
const parents={fields:'home',transport:'fields',taxi:'transport'};
const first=()=>({id:1,rate:90,initial:27000000,debt:27000000,task:null,last:null,count:0});
const blank=()=>({balance:0,rate:90,seq:2,cars:[first()],introDone:false});
let state=blank(),page='home',opened=null,buyOpen=false,message='',db=null,ready=false,dirty=false;
function clock(){
 const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 $('#myon-date').textContent=p.year+'.'+p.month+'.'+p.day;
 $('#myon-clock').textContent=p.hour+':'+p.minute;
}
function openDB(){return new Promise((resolve,reject)=>{
 const request=indexedDB.open(DB,1);
 request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE);};
 request.onsuccess=()=>resolve(request.result);
 request.onerror=()=>reject(request.error);
});}
function load(){return new Promise((resolve,reject)=>{
 const tx=db.transaction(STORE,'readonly');
 const req=tx.objectStore(STORE).get(KEY);
 req.onsuccess=()=>resolve(req.result);
 req.onerror=()=>reject(req.error);
});}
function store(){
 if(!db||!ready||!dirty)return;
 dirty=false;
 try{
  const tx=db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put(JSON.parse(JSON.stringify(state)),KEY);
  tx.onerror=()=>{dirty=true;message='저장 오류: 다시 시도합니다.';};
 }catch(error){dirty=true;}
}
function changed(){dirty=true;store();}

function sanitizeTask(t,now){
 if(!t||!Number.isFinite(t.km)||t.km<1||t.km>10||!Number.isFinite(t.end)||!Number.isFinite(t.duration)||t.duration<=0)return null;
 const km=Math.round(t.km*10)/10,duration=Math.round(km*3*60000);
 if(Number.isFinite(t.startedAt)&&t.startedAt>=0&&Math.abs(t.end-t.startedAt-t.duration)<1000&&Math.abs(t.duration-duration)<1000)
  return {km,startedAt:t.startedAt,duration,end:t.end};
 // 이전 v0.06.1 지연 시간을 폐기하되 운행 중 진행률은 보존합니다.
 const ratio=Math.max(0,Math.min(1,(now-(t.end-t.duration))/t.duration));
 const startedAt=now-ratio*duration;
 return {km,startedAt,duration,end:startedAt+duration};
}
function validate(s){
 if(!s||typeof s!=='object'||!Array.isArray(s.cars)||!s.cars.length)return blank();
 const now=Date.now();
 const cars=s.cars.slice(0,500).filter(c=>c&&Number.isSafeInteger(c.id)&&c.id>0&&Number.isFinite(c.debt)&&c.debt>=0&&c.debt<=PRICE&&Number.isInteger(c.rate)&&c.rate>=0&&c.rate<=90&&Number.isFinite(c.initial)&&c.initial>=0&&c.initial<=PRICE).map(c=>({
  id:c.id,rate:c.rate,initial:c.initial,debt:Math.min(c.debt,c.initial),
  task:sanitizeTask(c.task,now),
  last:c.last&&Number.isFinite(c.last.received)?c.last:null,
  count:Number.isSafeInteger(c.count)&&c.count>=0?c.count:0
 }));
 if(!cars.length||new Set(cars.map(c=>c.id)).size!==cars.length)return blank();
 return {balance:Number.isSafeInteger(s.balance)&&s.balance>=0?s.balance:0,rate:Number.isInteger(s.rate)?Math.max(0,Math.min(90,s.rate)):90,seq:Math.max(...cars.map(c=>c.id))+1,cars,introDone:s.introDone===true};
}
function fareFor(km){return 4800+Math.floor(Math.max(0,Math.round(km*1000)-1600)/131)*100;}
function timeLeft(seconds){
 const s=Math.max(0,Math.ceil(seconds)),hours=Math.floor(s/3600),minutes=Math.floor(s%3600/60),secs=s%60;
 return (hours?hours+':':'')+String(minutes).padStart(2,'0')+':'+String(secs).padStart(2,'0');
}
function newTrip(c,at=Date.now()){
 if(c.task)return;
 const km=Math.round((1+Math.random()*9)*10)/10,duration=Math.round(km*3*60000);
 c.task={km,startedAt:at,duration,end:at+duration};
}
function settle(c){
 if(!c.task)return;
 const gross=fareFor(c.task.km),paid=Math.min(c.debt,Math.round(gross*c.rate/100));
 c.debt-=paid;
 const received=gross-paid;
 state.balance=Math.min(Number.MAX_SAFE_INTEGER,state.balance+received);
 c.last={fare:gross,received,city:paid,km:c.task.km,delayMinutes:0};
 c.count++;c.task=null;
}
function advance(now=Date.now()){
 let modified=false;
 for(const c of state.cars){
  if(!c.task){newTrip(c,now);modified=true;}
  // 모든 차량이 시 지원금 완납 여부와 상관없이 상시 자동 운행합니다.
  // 장기간 미접속 운행도 순차 정산하며, 프레임별 과부하를 방지합니다.
  let count=0;
  while(c.task&&c.task.end<=now&&count<5000){
   const nextAt=c.task.end;
   settle(c);newTrip(c,nextAt);modified=true;count++;
  }
 }
 if(modified)changed();
 return modified;
}
function meterMetrics(t,now=Date.now()){
 if(!t)return {distance:'0.0',time:'00:00',fare:4800,percent:0};
 const fraction=Math.max(0,Math.min(1,(now-t.startedAt)/t.duration));
 const remaining=Math.max(0,Math.ceil(t.km*(1-fraction)*10-1e-8)/10);
 return {distance:remaining.toFixed(1),time:timeLeft((t.end-now)/1000),fare:fareFor(t.km*fraction),percent:fraction*100};
}
function carHTML(c){
 const v=meterMetrics(c.task);
 return '<article class="card taxi-card" aria-label="택시 '+c.id+'호차">'+
 '<div class="meter"><div class="meter-head"><span data-distance="'+c.id+'">'+v.distance+' km</span><span data-timer="'+c.id+'">'+v.time+'</span></div>'+
 '<div class="meter-price" data-fare="'+c.id+'">'+money(v.fare)+'</div>'+
 '<div class="thin meter-bar"><i data-trip="'+c.id+'" style="width:'+v.percent+'%"></i></div></div>'+
 (c.debt>0?'<div class="support"><span>시 지원금 잔액</span><strong>'+money(c.debt)+'</strong><button type="button" data-act="expand" data-id="'+c.id+'" aria-label="택시 '+c.id+'호차 상환">'+(opened===c.id?'닫기':'상환')+'</button></div>':'')+
 (c.debt>0&&opened===c.id?
 '<div class="panel"><div class="detailrow"><span>차량가격</span><strong>'+money(PRICE)+'</strong><span>시 납부율</span><strong>'+c.rate+'%</strong><span>미상환 지원금</span><strong>'+money(c.debt)+'</strong></div>'+
 '<div class="entry"><input type="number" min="1" step="1" placeholder="중도 상환금 (M)" data-pay="'+c.id+'" aria-label="택시 '+c.id+'호차 중도 상환금"><button type="button" data-act="repay" data-id="'+c.id+'">상환</button></div>'+
 '<button type="button" class="btn full" data-act="all" data-id="'+c.id+'" '+(state.balance<c.debt?'disabled':'')+'>전액 상환 · '+money(c.debt)+'</button></div>':'')+'</article>';
}



/* 첫 접속 메시지는 첫 게임 시작 때만 표시하고, 완료 여부는 v0.07 저장 데이터에 보존합니다. */
let introStep=0,introAnswer='';
const introBubble=(body,fromMe=false)=>'<div class="intro-bubble'+(fromMe?' mine':'')+'">'+body+'</div>';
function renderIntro(){
 const box=$('#intro-conversation'),actions=$('#intro-actions');
 let html='<div class="intro-divider">첫 번째 연락</div>'+
  introBubble('안녕하세요. 갑작스럽게 연락드려 죄송합니다.\n\n현재 도시의 교통 운영이 불안정한 상황입니다.\n\n잠깐 도와주실 수 있을까요?');
 if(introStep>=1){
  html+=introBubble(introAnswer,true)+
   introBubble('여러 분야의 도움이 필요하지만, 지금은 택시 분야부터 관리해 주셔야 합니다.\n\n시에서 지원하는 택시 한 대가 준비되어 있습니다. 차량은 자동으로 운행하고, 운행이 끝나면 수익이 정산됩니다.');
 }
 if(introStep>=2){
  html+=introBubble('알겠어요. 택시 운영을 시작하겠습니다.',true)+
   introBubble('감사합니다. MYON에서 첫 운행을 확인해 주세요.');
 }
 box.innerHTML=html;
 if(introStep===0){
  actions.innerHTML='<span class="intro-label">답변을 선택하세요</span>'+
   '<button type="button" data-intro="question">무슨 일이 생긴 건가요?</button>'+
   '<button type="button" data-intro="help">제가 어떻게 도와드리면 될까요?</button>';
 }else if(introStep===1){
  actions.innerHTML='<span class="intro-label">답변을 선택하세요</span>'+
   '<button type="button" data-intro="agree">알겠어요. 택시 운영을 시작하겠습니다.</button>';
 }else{
  actions.innerHTML='<button type="button" data-intro="finish">MYON 운영 화면으로 이동 →</button>';
 }
 box.scrollTop=box.scrollHeight;
}
function updateIntro(){
 const show=!state.introDone;
 $('#intro-root').hidden=!show;
 $('#game-shell').style.visibility='visible';
 $('#game-shell').inert=show;
 document.body.style.overflow=show?'hidden':'';
 if(show)renderIntro();
}
$('#intro-root').addEventListener('click',event=>{
 const btn=event.target.closest('button[data-intro]');
 if(!btn||!ready)return;
 const a=btn.dataset.intro;
 if(introStep===0&&(a==='question'||a==='help')){
  introAnswer=a==='question'?'무슨 일이 생긴 건가요?':'제가 어떻게 도와드리면 될까요?';
  introStep=1;renderIntro();
 }else if(introStep===1&&a==='agree'){
  introStep=2;renderIntro();
 }else if(introStep===2&&a==='finish'){
  state.introDone=true;
  changed();
  updateIntro();
  go('home');
 }
});

function draw(){
 $('#balance').textContent=money(state.balance);
 $('#current').textContent=names[page];
 $('#back').disabled=page==='home';
 const content=$('#content');
 if(page==='home'){
  const rides=state.cars.reduce((sum,c)=>sum+c.count,0);
  content.innerHTML='<section class="card home-overview">'+
   '<h2>현재 목표</h2>'+
   '<strong>'+(rides===0?'택시 첫 운행 확인':'택시 자동 운행 관찰')+'</strong>'+
   '<p>'+(rides===0?'첫 차량이 자동 운행 중입니다. 운행 종료 후 첫 수익이 정산됩니다.':'첫 운행을 완료했습니다. 택시 사업은 계속 자동으로 운영됩니다.')+'</p>'+
   '<div class="row"><span class="dim">운영 중인 사업</span><strong>교통 · 택시</strong></div>'+
   '<div class="row"><span class="dim">동시 관찰 가능</span><strong>1대</strong></div>'+
   '<div class="home-actions"><button type="button" data-act="nav" data-next="taxi">택시 운행 보기 ›</button>'+
   '<button type="button" data-act="nav" data-next="fields">분야 보기 ›</button></div>'+
   '</section>';
  return;
 }
 if(page!=='taxi'){
  const next=page==='fields'?'transport':'taxi';
  content.innerHTML='<button type="button" class="menu '+(page==='home'?'primary':'')+'" data-act="nav" data-next="'+next+'"><span>'+names[next]+'</span><span class="chevron">›</span></button>';
  return;
 }
 let html=state.cars.map(carHTML).join('');
 const aid=Math.round(PRICE*state.rate/100),own=PRICE-aid,atLimit=state.cars.length>=MAX_TAXIS;
 html+='<div class="card">'+(atLimit?
 '<div class="buyhead"><span>택시 보유 한도</span><strong>'+state.cars.length+' / '+MAX_TAXIS+'대</strong></div>':
 '<button type="button" class="buyhead" data-act="buyopen"><span>＋ 택시 추가 구매 ('+state.cars.length+'/'+MAX_TAXIS+')</span><span class="dim">'+(buyOpen?'⌃':'›')+'</span></button>'+
 (buyOpen?'<div class="panel"><div class="row"><span class="dim">시 지원 비율</span><strong class="green" id="rate-label">'+state.rate+'%</strong></div>'+
 '<input class="range" type="range" min="0" max="90" step="1" value="'+state.rate+'" id="rate-slider" aria-label="시 지원 비율">'+
 '<div class="detailrow"><span>차량가격</span><strong>'+money(PRICE)+'</strong><span>시 지원금</span><strong id="aid-label">'+money(aid)+'</strong><span>자기 부담금</span><strong id="own-label">'+money(own)+'</strong></div>'+
 '<button type="button" class="btn mainbtn full" data-act="purchase" id="purchase" '+(state.balance<own?'disabled':'')+'>구매 · '+money(own)+'</button></div>':'')
 )+'</div>';
 html+='<div class="message" role="status">'+message+'</div>';
 content.innerHTML=html;
}

function go(target){if(!names[target])return;page=target;message='';draw();$('#main').scrollTop=0;}
$('#back').addEventListener('click',()=>go(parents[page]||'home'));
$('#home').addEventListener('click',()=>go('home'));
document.addEventListener('input',e=>{
 if(e.target.id!=='rate-slider')return;
 state.rate=Number(e.target.value);
 const aid=Math.round(PRICE*state.rate/100),own=PRICE-aid;
 $('#rate-label').textContent=state.rate+'%';
 $('#aid-label').textContent=money(aid);
 $('#own-label').textContent=money(own);
 const buy=$('#purchase');buy.disabled=state.balance<own;buy.textContent='구매 · '+money(own);
 changed();
});

document.addEventListener('click',e=>{
 const btn=e.target.closest('button[data-act]');if(!btn||!ready)return;
 const act=btn.dataset.act,id=Number(btn.dataset.id),c=state.cars.find(v=>v.id===id);
 if(act==='nav'){go(btn.dataset.next);return;}
 if(act==='expand'){opened=opened===id?null:id;draw();return;}
 if(act==='buyopen'){if(state.cars.length>=MAX_TAXIS)return;buyOpen=!buyOpen;draw();return;}
 if((act==='repay'||act==='all')&&c&&c.debt>0){
  const amount=act==='all'?c.debt:Number(document.querySelector('[data-pay="'+id+'"]')?.value);
  if(!Number.isSafeInteger(amount)||amount<=0){message='상환금액을 확인해주세요.';draw();return;}
  const applied=Math.min(amount,c.debt);
  if(applied>state.balance){message='공용 자금이 부족합니다.';draw();return;}
  state.balance-=applied;c.debt-=applied;
  if(c.debt===0){opened=null;message='택시 '+id+'호차 지원금 완납';}
  else message=money(applied)+' 상환 완료';
  changed();draw();return;
 }
 if(act==='purchase'){
  if(state.cars.length>=MAX_TAXIS){message='택시는 최대 '+MAX_TAXIS+'대까지 보유할 수 있습니다.';draw();return;}
  const aid=Math.round(PRICE*state.rate/100),own=PRICE-aid;
  if(state.balance<own)return;
  state.balance-=own;
  const v={id:state.seq++,rate:state.rate,initial:aid,debt:aid,task:null,last:null,count:0};
  state.cars.push(v);newTrip(v);
  buyOpen=false;message='택시 '+v.id+'호차 구매 완료';
  changed();draw();
 }
});
setInterval(()=>{
 if(!ready)return;
 const now=Date.now(),finished=advance(now);
 if(finished){draw();return;}
 if(page==='taxi')for(const c of state.cars){
  const v=meterMetrics(c.task,now);
  const distance=document.querySelector('[data-distance="'+c.id+'"]');if(distance)distance.textContent=v.distance+' km';
  const timer=document.querySelector('[data-timer="'+c.id+'"]');if(timer)timer.textContent=v.time;
  const fare=document.querySelector('[data-fare="'+c.id+'"]');if(fare)fare.textContent=money(v.fare);
  const bar=document.querySelector('[data-trip="'+c.id+'"]');if(bar)bar.style.width=v.percent+'%';
 }
},200);

clock();setInterval(clock,15000);
(async()=>{
 let saved=null;
 try{db=await openDB();saved=await load();if(saved)state=validate(saved);}
 catch(e){message='자동 저장을 사용할 수 없습니다.';}
 ready=true;
 advance(Date.now());
 draw();
 updateIntro();
})();
})();
</script>
</body>
</html>

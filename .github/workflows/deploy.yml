name: Deploy MYON environments
on:
  push:
    branches: [main, test, develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  # GitHub Pages deployment belongs to main only. Non-main pushes ask
  # the main-branch workflow to rebuild all three public environments.
  request-main-deploy:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Ask main to publish the latest three branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" -f ref=main
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: test
          path: test
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Build official game
        working-directory: main
        run: |
          npm ci
          npm run build
      - name: Build test game
        working-directory: test
        env:
          MYON_BASE_PATH: /MYON/test/
        run: |
          npm ci
          npm run build
      - name: Build integrated development game
        working-directory: develop
        env:
          MYON_BASE_PATH: /MYON/dev/integrated/
        run: |
          npm ci
          npm run build
      - name: Assemble published paths
        run: |
          mkdir -p site/test site/dev/integrated
          cp -a main/dist/. site/
          cp -a test/dist/. site/test/
          cp -a develop/dist/. site/dev/integrated/
          test -f site/index.html
          test -f site/test/index.html
          test -f site/dev/integrated/index.html
          test -f site/myon-v013.js
          test -f site/test/myon-v013.js
          test -f site/dev/integrated/myon-v013.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b101b">
<title>MYON</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#0b101b;color:#edf3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh}
[hidden]{display:none!important}
.screen{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#182d45 0%,#0b101b 58%)}
.intro{width:min(100%,340px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
.symbol{width:74px;height:74px;display:grid;place-items:center;margin-bottom:2px;color:#91def4}
h1{margin:0;font-size:clamp(48px,12vw,76px);line-height:1;letter-spacing:.13em;font-weight:750;padding-left:.13em}
.subtitle{margin:0;font-size:14px;letter-spacing:.17em;color:#a3afc3}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:50px;font-weight:650}
.start{width:100%;margin-top:24px;color:#0b1724;background:#a5e5f6;border:1px solid #b9edfa;box-shadow:0 8px 32px #72cde61a}
.start:hover{background:#c0effb}
button:focus-visible{outline:3px solid white;outline-offset:4px}
.start:active{transform:translateY(1px)}
.world{min-height:100vh;min-height:100svh;width:min(100%,680px);margin:0 auto;padding:20px clamp(16px,5vw,32px)}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263243;padding-bottom:16px;gap:16px;margin-bottom:16px}
.brand{font-weight:750;color:#91def4}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.clock-time{font-size:19px;font-weight:650}
.clock-date{font-size:11px;color:#a3afc3;margin-top:2px}
.section-title{font-size:15px;font-weight:700;margin:0 0 12px}
.mission-style{font-size:13px;color:#a5e5f6;margin-top:4px}
.mission-select{min-height:0;border:1px solid #365a6d;border-radius:6px;padding:8px;background:transparent;color:#edf3ff;font-size:13px;white-space:nowrap}
.mission-select:hover{background:#1a2b3d}
.missions{display:flex;flex-direction:column;gap:12px}
.mission{background:#111b2a;border:1px solid #263243;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.mission-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mission-name{font-size:15px;font-weight:700}
.mission-time{color:#a5e5f6;font-variant-numeric:tabular-nums;font-size:14px}
.mission-track{height:5px;background:#263243;border-radius:999px;overflow:hidden}
.mission-fill{height:100%;background:#91def4;border-radius:999px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main id="home" class="screen">
  <section class="intro" aria-labelledby="game-title">
    <svg class="symbol" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <path d="M40 4 72 22v36L40 76 8 58V22L40 4Z" stroke="currentColor" stroke-width="1.6"/>
      <path d="m8 22 32 19 32-19M40 41v35M24 13l32 19v19" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="40" cy="41" r="3" fill="currentColor"/>
    </svg>
    <h1 id="game-title">MYON</h1>
    <p class="subtitle">새로운 시작</p>
    <button id="start" class="start" type="button">게임 시작</button>
  </section>
</main>
<main id="world" class="world" hidden>
  <header><span class="brand">MYON</span><div id="clock" class="clock" tabindex="-1"><div id="clock-time" class="clock-time"></div><div id="clock-date" class="clock-date"></div></div></header>
  <h2 class="section-title">등장 임무</h2>
  <section id="missions" class="missions" aria-label="등장 임무 및 진행 중인 임무"></section>
</main>
<script>
'use strict';
const home=document.getElementById('home');
const world=document.getElementById('world');
const start=document.getElementById('start');
const list=document.getElementById('missions');
const CONTENT=Object.freeze({'교통':Object.freeze(['택시','버스','철도','항공','선박','우주'])});
const TYPES=Object.freeze(['관전형','방치형','운영형','운송형','경제형','리얼형']);
const clockFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function updateClock(){
  const p=Object.fromEntries(clockFormat.formatToParts(new Date()).map(x=>[x.type,x.value]));
  document.getElementById('clock-time').textContent=p.hour+':'+p.minute;
  document.getElementById('clock-date').textContent=p.year+'.'+p.month+'.'+p.day;
}
// All timings are expressed in ticks. One tick equals one elapsed real second.
const SPAWN_INTERVAL=30, MIN_DURATION=60, MAX_DURATION=600;
let startedAt=null, nextSpawn=0, lastTick=-1, active=[];
function randomInt(min,max){return min+Math.floor(Math.random()*(max-min+1))}
function spawn(tick){
  const duration=randomInt(MIN_DURATION,MAX_DURATION);
  const fields=Object.keys(CONTENT),field=fields[randomInt(0,fields.length-1)],items=CONTENT[field];
  return {id:tick,field,content:items[randomInt(0,items.length-1)],type:TYPES[randomInt(0,TYPES.length-1)],start:tick,end:tick+duration,duration,selected:false};
}
function formatTime(seconds){
  const hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),secs=seconds%60;
  return [hours,minutes,secs].map(n=>String(n).padStart(2,'0')).join(':');
}
function render(tick){
  const focused=document.activeElement?.dataset?.missionId;
  const fragment=document.createDocumentFragment();
  for(const m of active){
    const card=document.createElement('article');
    card.className='mission';
    const row=document.createElement('div');
    row.className='mission-row';
    const info=document.createElement('div');
    const name=document.createElement('div');
    name.className='mission-name';
    name.textContent=m.content;
    const style=document.createElement('div');
    style.className='mission-style';
    style.textContent=m.type;
    info.append(name,style);
    row.append(info);
    if(m.selected){
      const remaining=m.end-tick,percent=100*(tick-m.start)/m.duration;
      const time=document.createElement('span');
      time.className='mission-time';
      time.textContent=formatTime(remaining);
      row.append(time);
      card.append(row);
      const track=document.createElement('div');
      track.className='mission-track';
      track.setAttribute('role','progressbar');
      track.setAttribute('aria-label',m.content+' '+m.type+' 진행률');
      track.setAttribute('aria-valuemin','0');
      track.setAttribute('aria-valuemax','100');
      track.setAttribute('aria-valuenow',String(Math.floor(percent)));
      const fill=document.createElement('div');
      fill.className='mission-fill';
      fill.style.width=percent+'%';
      track.append(fill);
      card.append(track);
    }else{
      const button=document.createElement('button');
      button.type='button';
      button.className='mission-select';
      button.dataset.missionId=String(m.id);
      button.textContent='임무 선택';
      button.setAttribute('aria-label',m.content+' '+m.type+' 임무 선택');
      row.append(button);
      card.append(row);
    }
    fragment.append(card);
  }
  list.replaceChildren(fragment);
  if(focused!==undefined){
    const button=Array.from(list.querySelectorAll('[data-mission-id]')).find(b=>b.dataset.missionId===focused);
    if(button)button.focus({preventScroll:true});
  }
}
list.addEventListener('click',event=>{
  const button=event.target.closest('[data-mission-id]');
  if(!button||startedAt===null)return;
  const id=Number(button.dataset.missionId);
  update();
  const mission=active.find(m=>m.id===id&&!m.selected);
  if(!mission)return;
  const tick=lastTick;
  mission.selected=true;
  mission.start=tick;
  mission.end=tick+mission.duration;
  active.sort((a,b)=>a.end-b.end||a.id-b.id);
  render(tick);
});
function update(){
  if(startedAt===null)return;
  const tick=Math.max(0,Math.floor((performance.now()-startedAt)/1000));
  if(tick===lastTick)return;
  lastTick=tick;
  updateClock();
  active=active.filter(m=>m.end>tick);
  // No reward or history exists yet. Expired unseen missions need not be replayed.
  if(nextSpawn<=tick-MAX_DURATION){
    nextSpawn+=Math.ceil((tick-MAX_DURATION+1-nextSpawn)/SPAWN_INTERVAL)*SPAWN_INTERVAL;
  }
  while(nextSpawn<=tick){
    const mission=spawn(nextSpawn);
    if(mission.end>tick)active.push(mission);
    nextSpawn+=SPAWN_INTERVAL;
  }
  active.sort((a,b)=>a.end-b.end||a.id-b.id);
  render(tick);
}
start.addEventListener('click',()=>{
  if(startedAt!==null)return;
  startedAt=performance.now();
  home.hidden=true;
  world.hidden=false;
  document.getElementById('clock').focus();
  update();
  window.setInterval(update,250);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b101b">
<title>MYON</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#0b101b;color:#edf3ff}
*{box-sizing:border-box}
html,body{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{margin:0;min-height:100vh;min-height:100svh}
[hidden]{display:none!important}
.screen{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#182d45 0%,#0b101b 58%)}
.intro{width:min(100%,340px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
.symbol{width:74px;height:74px;display:grid;place-items:center;margin-bottom:2px;color:#91def4}
h1{margin:0;font-size:clamp(48px,12vw,76px);line-height:1;letter-spacing:.13em;font-weight:750;padding-left:.13em}
.subtitle{margin:0;font-size:14px;letter-spacing:.17em;color:#a3afc3}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:50px;font-weight:650}
.start{width:100%;margin-top:24px;color:#0b1724;background:#a5e5f6;border:1px solid #b9edfa;box-shadow:0 8px 32px #72cde61a}
.start:hover{background:#c0effb}
button:focus-visible{outline:3px solid white;outline-offset:4px}
.start:active{transform:translateY(1px)}
.world{min-height:100vh;min-height:100svh;width:min(100%,680px);margin:0 auto;padding:20px clamp(16px,5vw,32px)}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #263243;padding-bottom:16px;gap:16px;margin-bottom:16px}
.brand{font-weight:750;color:#91def4}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.clock-time{font-size:19px;font-weight:650}
.clock-date{font-size:11px;color:#a3afc3;margin-top:2px}
.section-title{font-size:15px;font-weight:700;margin:0 0 12px}
.mission-tag{display:inline-flex;align-items:center;flex-shrink:0;padding:3px 7px;border-radius:5px;font-size:11px;line-height:1.25;font-weight:650;white-space:nowrap;background:#263243;color:#a3afc3}
.mission-tag[data-style="관전형"]{background:#182e3c;color:#91def4}
.mission-tag[data-style="방치형"]{background:#19352b;color:#a6ddb5}
.mission-tag[data-style="운영형"]{background:#302744;color:#c4b5fd}
.mission-tag[data-style="운전형"]{background:#3b3022;color:#f2cd91}
.mission-tag[data-style="리얼형"]{background:#402731;color:#f0a6af}
.mission-select{min-height:0;border:1px solid #365a6d;border-radius:6px;padding:8px;background:transparent;color:#edf3ff;font-size:13px;white-space:nowrap}
.mission-select:hover{background:#1a2b3d}
.update-notice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#142a38;border:1px solid #365a6d;border-radius:10px;padding:12px;margin-bottom:16px;font-size:13px;color:#a5e5f6}
.save-error{font-size:12px;color:#f6bf9d;margin:0 0 12px}
.missions{display:flex;flex-direction:column;gap:12px}
.mission{background:#111b2a;border:1px solid #263243;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.mission-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mission-name{font-size:15px;font-weight:700}
.mission-time{color:#b9edfa;font-variant-numeric:tabular-nums;font-size:15px;font-weight:650;text-align:right;line-height:1.3}
.mission-track{height:5px;background:#263243;border-radius:999px;overflow:hidden}
.mission-fill,.auto-fill{height:100%;width:100%;border-radius:999px;transform-origin:left center;will-change:transform}
.mission-fill{background:#91def4;transform:scaleX(0)}
.auto-fill{background:#7b91ae;transform:scaleX(1)}
.pending{padding:8px 12px;gap:5px}
.mission-info{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.mission-time{flex-shrink:0;white-space:nowrap}
.pending .mission-select{padding:4px 8px;font-size:12px}
.auto-row{display:flex;align-items:center;gap:8px}
.auto-row .mission-track{flex:1;min-width:0}
.auto-label{font-size:10px;color:#a3afc3;font-variant-numeric:tabular-nums;white-space:nowrap}
.world{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.bottom-nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);display:grid;grid-template-columns:1fr 1fr;background:#0b101b;border-top:1px solid #263243;padding:5px clamp(16px,5vw,32px) calc(5px + env(safe-area-inset-bottom,0px))}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:0;color:#a3afc3;font-size:12px;min-height:49px;border-radius:6px}
.nav-item[aria-current="page"]{color:#91def4}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.play-settings{display:flex;flex-direction:column;gap:8px}
.style-group{background:#111b2a;border:1px solid #263243;border-radius:10px;overflow:hidden}
.style-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:transparent;color:#edf3ff;border:0;padding:12px;min-height:44px;font-size:15px}
.style-toggle svg{width:16px;height:16px;stroke:#a3afc3;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.style-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.style-content{padding:0 12px 8px}
.field-name{font-size:11px;color:#a3afc3;padding:0 0 6px}
.receive-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #263243;padding:8px 0;font-size:13px}
.receive-control{display:flex;align-items:center;gap:6px;color:#a3afc3;font-size:12px;cursor:pointer;white-space:nowrap}
.receive-control input{margin:0;width:16px;height:16px;accent-color:#91def4}
.receive-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.receive-detail{font-size:11px;color:#a3afc3;line-height:1.4}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main id="home" class="screen">
  <section class="intro" aria-labelledby="game-title">
    <svg class="symbol" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <path d="M40 4 72 22v36L40 76 8 58V22L40 4Z" stroke="currentColor" stroke-width="1.6"/>
      <path d="m8 22 32 19 32-19M40 41v35M24 13l32 19v19" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="40" cy="41" r="3" fill="currentColor"/>
    </svg>
    <h1 id="game-title">MYON</h1>
    <p class="subtitle">새로운 시작</p>
    <button id="start" class="start" type="button">게임 시작</button>
  </section>
</main>
<main id="world" class="world" hidden>
  <header><span class="brand">MYON</span><div id="clock" class="clock" tabindex="-1"><div id="clock-time" class="clock-time"></div><div id="clock-date" class="clock-date"></div></div></header>
  <section id="update-notice" class="update-notice" aria-label="게임 업데이트" hidden><span role="status">신규 업데이트 있음</span><button id="apply-update" class="mission-select" type="button">적용</button></section>
  <p id="save-error" class="save-error" role="alert" hidden></p>
  <section id="home-panel">
    <h2 class="section-title">등장 임무</h2>
    <section id="missions" class="missions" aria-label="등장 임무 및 진행 중인 임무"></section>
  </section>
  <section id="play-panel" hidden>
    <h2 class="section-title">플레이</h2>
    <div id="play-settings" class="play-settings"></div>
  </section>
  <nav class="bottom-nav" aria-label="하단 메뉴">
    <button type="button" class="nav-item" data-page="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></button>
    <button type="button" class="nav-item" data-page="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12c2 0 3 2 4 7 .5 3-1 5-3 4l-4-3H9l-4 3c-2 1-3.5-1-3-4 1-5 2-7 4-7zM7 9v6m-3-3h6m6-1h.01m3 3h.01"/></svg><span>플레이</span></button>
  </nav>
</main>
<script>
'use strict';
const home=document.getElementById('home');
const world=document.getElementById('world');
const start=document.getElementById('start');
const list=document.getElementById('missions');
const BUILD_REVISION='__MYON_BUILD_REVISION__';
const SAVE_KEY='myon.session.20261128';
const UPDATE_RESUME_KEY='myon.update.resume';
const UPDATE_INTERVAL=10000;
const UPDATE_SCROLL_KEY='myon.update.scroll';
const UPDATE_VIEW_KEY='myon.update.view';
const notice=document.getElementById('update-notice');
const applyButton=document.getElementById('apply-update');
const saveError=document.getElementById('save-error');
let availableRevision=null, checking=false, lastCheck=-Infinity, saveBlocked=false, applying=false;
const CONTENT=Object.freeze({'교통':Object.freeze(['택시','버스','철도','항공','선박','우주'])});
const TYPES=Object.freeze(['관전형','방치형','운영형','운전형','리얼형']);
const MINUTE=60,HOUR=3600,DAY=86400;
// Observation missions use elapsed time only. A paired leg is a separate offer.
const OBSERVATION=Object.freeze([
  {content:'택시',source:'택시',min:4*MINUTE,max:13*MINUTE,interval:MINUTE,durationText:'4~13분 랜덤',intervalText:'1분'},
  {content:'시내버스',source:'버스',min:30*MINUTE,max:30*MINUTE,interval:5*MINUTE,durationText:'30분',intervalText:'5분'},
  {content:'광역버스',source:'버스',min:70*MINUTE,max:70*MINUTE,interval:10*MINUTE,durationText:'70분',intervalText:'10분'},
  {content:'지하철',source:'철도',min:90*MINUTE,max:90*MINUTE,interval:15*MINUTE,durationText:'편도 1시간 30분',intervalText:'15분',out:'하행',back:'상행'},
  {content:'일반열차',source:'철도',min:3*HOUR,max:3*HOUR,interval:30*MINUTE,durationText:'편도 3시간',intervalText:'30분',out:'하행',back:'상행'},
  {content:'고속열차',source:'철도',min:2*HOUR,max:2*HOUR,interval:20*MINUTE,durationText:'편도 2시간',intervalText:'20분',out:'하행',back:'상행'},
  {content:'국내선',source:'항공',min:90*MINUTE,max:90*MINUTE,interval:15*MINUTE,durationText:'편도 1시간 30분',intervalText:'15분',out:'출발편',back:'복귀편'},
  {content:'국제선',source:'항공',min:14*HOUR,max:14*HOUR,interval:2*HOUR,durationText:'편도 14시간',intervalText:'2시간',out:'출발편',back:'복귀편'},
  {content:'선박',source:'선박',min:14*HOUR,max:40*DAY,interval:DAY,durationText:'편도 14시간~40일 랜덤',intervalText:'1일',out:'출발편',back:'복귀편'},
  {content:'우주',source:'우주',min:30*DAY,max:365*DAY,interval:7*DAY,durationText:'편도 30~365일 랜덤',intervalText:'7일',out:'출발편',back:'복귀편'}
].map(x=>Object.freeze({...x,type:'관전형',field:'교통',key:JSON.stringify(['관전형','교통',x.content])})));
const COMBINATIONS=Object.freeze([...OBSERVATION,...TYPES.filter(type=>type!=='관전형').flatMap(type=>Object.entries(CONTENT).flatMap(([field,items])=>items.map(content=>Object.freeze({type,field,content,key:JSON.stringify([type,field,content])}))))]);
let observationNext=Object.create(null);
const validKeys=new Set(COMBINATIONS.map(x=>x.key));
let enabled=new Set(),currentPage='home',expandedStyle='';
const settings=document.getElementById('play-settings');
const homePanel=document.getElementById('home-panel');
const playPanel=document.getElementById('play-panel');
const navItems=Array.from(world.querySelectorAll('[data-page]'));
function setPage(page,resetScroll=true){
  currentPage=page==='play'?'play':'home';
  homePanel.hidden=currentPage!=='home';
  playPanel.hidden=currentPage!=='play';
  for(const button of navItems){
    if(button.dataset.page===currentPage)button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
  if(resetScroll)window.scrollTo(0,0);
}
function renderSettings(){
  settings.replaceChildren();
  for(const type of TYPES){
    const group=document.createElement('section');
    group.className='style-group';
    const toggle=document.createElement('button');
    toggle.type='button';
    toggle.className='style-toggle';
    toggle.setAttribute('aria-expanded',String(expandedStyle===type));
    const label=document.createElement('span');
    label.textContent=type;
    toggle.append(label);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('aria-hidden','true');
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','m6 9 6 6 6-6');
    svg.append(path);toggle.append(svg);
    toggle.addEventListener('click',()=>{
      expandedStyle=expandedStyle===type?'':type;
      renderSettings();
      const target=Array.from(settings.querySelectorAll('.style-toggle')).find(x=>x.textContent===type);
      if(target)target.focus({preventScroll:true});
    });
    group.append(toggle);
    if(expandedStyle===type){
      const body=document.createElement('div');
      body.className='style-content';
      for(const field of Object.keys(CONTENT)){
        const heading=document.createElement('div');
        heading.className='field-name';
        heading.textContent=field;
        body.append(heading);
        for(const c of COMBINATIONS.filter(x=>x.type===type&&x.field===field)){
          const row=document.createElement('div');
          row.className='receive-row';
          const name=document.createElement('span');
          name.textContent=c.content;
          let info=name;
          if(c.type==='관전형'){
            info=document.createElement('div');
            info.className='receive-info';
            const detail=document.createElement('span');
            detail.className='receive-detail';
            detail.textContent=c.durationText+' · '+c.intervalText+'마다 등장';
            info.append(name,detail);
          }
          const control=document.createElement('label');
          control.className='receive-control';
          const checkbox=document.createElement('input');
          checkbox.type='checkbox';
          checkbox.checked=enabled.has(c.key);
          checkbox.setAttribute('aria-label',type+' '+c.content+' 임무 받기');
          checkbox.addEventListener('change',()=>{
            update();
            if(checkbox.checked){
              enabled.add(c.key);
              if(c.type==='관전형'){
                observationNext[c.key]=Math.max(0,lastTick);
                advanceObservation(Math.max(0,lastTick));
                syncCards();
                animateBars(Math.max(0,(performance.now()-startedAt)/1000));
              }
            }else{
              enabled.delete(c.key);
              if(c.type==='관전형')delete observationNext[c.key];
            }
            saveSession();
          });
          control.append(checkbox,'임무 받기');
          row.append(name,control);
          body.append(row);
        }
      }
      group.append(body);
    }
    settings.append(group);
  }
}
navItems.forEach(button=>button.addEventListener('click',()=>setPage(button.dataset.page)));
const clockFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function updateClock(){
  const p=Object.fromEntries(clockFormat.formatToParts(new Date()).map(x=>[x.type,x.value]));
  document.getElementById('clock-time').textContent=p.hour+':'+p.minute;
  document.getElementById('clock-date').textContent=p.year+'.'+p.month+'.'+p.day;
}
// All timings are expressed in ticks. One tick equals one elapsed real second.
const SPAWN_INTERVAL=30, AUTO_ACCEPT=60, MIN_DURATION=60, MAX_DURATION=600;
let startedAt=null, epoch=0, nextSpawn=0, lastTick=-1, active=[];
const views=new Map();
const clamp=n=>Math.max(0,Math.min(1,n));
function showSaveError(message){
  saveError.textContent=message;
  saveError.hidden=!message;
}
function saveSession(){
  if(startedAt===null||saveBlocked)return false;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({revision:BUILD_REVISION,epoch,tick:Math.max(0,lastTick),nextSpawn,active,enabled:Array.from(enabled),observationNext}));
    showSaveError('');
    return true;
  }catch(error){
    showSaveError('저장할 수 없습니다. 브라우저 저장 공간을 확인해 주세요.');
    return false;
  }
}
function readSession(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw===null)return null;
    const saved=JSON.parse(raw);
    if(!saved||typeof saved.revision!=='string'||!Number.isFinite(saved.epoch)||!Number.isSafeInteger(saved.tick)||saved.tick<0||!Number.isSafeInteger(saved.nextSpawn)||saved.nextSpawn<0||!Array.isArray(saved.active)||!saved.active.every(m=>m&&typeof m.id==='string'&&typeof m.field==='string'&&typeof m.content==='string'&&typeof m.type==='string'&&typeof m.selected==='boolean'&&Number.isSafeInteger(m.start)&&Number.isSafeInteger(m.end)&&Number.isSafeInteger(m.duration)&&m.duration>0&&m.end>=m.start&&m.rule==='timer-v1')){
      throw new Error('Invalid or unsupported save');
    }
    return saved;
  }catch(error){
    saveBlocked=true;
    showSaveError('기존 저장 데이터를 읽을 수 없습니다. 덮어쓰지 않고 보존합니다.');
    return null;
  }
}
async function checkUpdate(force=false){
  if(startedAt===null||checking||applying||(!force&&performance.now()-lastCheck<UPDATE_INTERVAL)||!/^[a-f0-9]{40}$/.test(BUILD_REVISION))return;
  checking=true;
  lastCheck=performance.now();
  const controller=new AbortController();
  const timeout=window.setTimeout(()=>controller.abort(),8000);
  try{
    const url=new URL('revision.txt',location.href);
    url.searchParams.set('_',String(Date.now()));
    const response=await fetch(url,{cache:'no-store',signal:controller.signal});
    if(!response.ok)return;
    const revision=(await response.text()).trim();
    if(!/^[a-f0-9]{40}$/.test(revision))return;
    availableRevision=revision===BUILD_REVISION?null:revision;
    notice.hidden=!availableRevision;
  }catch(error){
    // A failed check must never interrupt local play.
  }finally{window.clearTimeout(timeout);checking=false}
}
applyButton.addEventListener('click',()=>{
  if(!availableRevision||applying)return;
  update();
  if(!saveSession())return;
  const url=new URL(location.href);
  url.searchParams.set('update',availableRevision);
  url.searchParams.set('_',String(Date.now()));
  try{
    sessionStorage.setItem(UPDATE_SCROLL_KEY,String(window.scrollY));
    sessionStorage.setItem(UPDATE_VIEW_KEY,JSON.stringify({page:currentPage,style:expandedStyle}));
    sessionStorage.setItem(UPDATE_RESUME_KEY,availableRevision);
  }catch(error){
    showSaveError('현재 화면을 유지할 수 없어 업데이트를 적용하지 않았습니다.');
    return;
  }
  applying=true;
  applyButton.disabled=true;
  location.replace(url.href);
});
function randomInt(min,max){return min+Math.floor(Math.random()*(max-min+1))}
// The mission ID retains its original spawn tick even after acceptance.
function spawnTick(m){return Number(m.id.slice(m.id.lastIndexOf(':')+1))}
function missionOrder(a,b){
  if(a.selected!==b.selected)return a.selected?1:-1;
  const deadlineA=a.selected?a.end:autoAt(a);
  const deadlineB=b.selected?b.end:autoAt(b);
  return deadlineA-deadlineB||spawnTick(a)-spawnTick(b)||a.id.localeCompare(b.id);
}
function autoAt(m){return spawnTick(m)+AUTO_ACCEPT}
function accept(m,tick){
  m.selected=true;
  m.start=tick;
  m.end=tick+m.duration;
}
function spawn(tick){
  const duration=randomInt(MIN_DURATION,MAX_DURATION);
  const choices=COMBINATIONS.filter(c=>c.type!=='관전형'&&enabled.has(c.key));
  if(!choices.length)return null;
  const {field,content,type}=choices[randomInt(0,choices.length-1)];
  return {id:BUILD_REVISION+':'+tick,field,content,type,start:tick,end:tick+AUTO_ACCEPT,duration,rule:'timer-v1',selected:false};
}
function observationOffer(c,tick){
  const duration=randomInt(c.min,c.max);
  return {id:BUILD_REVISION+':observation:'+c.content+':'+tick,field:c.field,content:c.content+(c.out?' · '+c.out:''),type:c.type,start:tick,end:tick+duration,duration,rule:'timer-v1',selected:true,returnContent:c.back?c.content+' · '+c.back:null};
}
function advanceObservation(tick){
  let changed=false;
  for(const c of OBSERVATION){
    if(!enabled.has(c.key))continue;
    let next=observationNext[c.key];
    if(!Number.isSafeInteger(next)||next<0)next=tick;
    // Bound offline reconstruction by the maximum lifetime of both legs.
    const horizon=(c.back?2:1)*c.max;
    if(next<=tick-horizon)next+=Math.ceil((tick-horizon+1-next)/c.interval)*c.interval;
    while(next<=tick){
      const mission=observationOffer(c,next);
      if(!active.some(m=>m.id===mission.id))active.push(mission);
      next+=c.interval;
      changed=true;
    }
    if(observationNext[c.key]!==next){observationNext[c.key]=next;changed=true;}
  }
  return changed;
}
function advanceMissions(tick){
  let changed=false;
  const remaining=[];
  for(const original of active){
    let m=original;
    while(m){
      if(!m.selected&&m.type==='관전형'){accept(m,Math.min(tick,autoAt(m)));changed=true;}
      else if(!m.selected&&tick>=autoAt(m)){accept(m,autoAt(m));changed=true;}
      if(!m.selected||m.end>tick){remaining.push(m);break;}
      changed=true;
      // The return is part of the already-started trip; it inherits its exact duration.
      if(m.returnContent){
        const departure=m.end;
        m={id:m.id+':return:'+departure,field:m.field,content:m.returnContent,type:m.type,start:departure,end:departure+(m.type==='관전형'?m.duration:AUTO_ACCEPT),duration:m.duration,rule:'timer-v1',selected:m.type==='관전형',pairedReturn:true};
      }else m=null;
    }
  }
  active=remaining;
  return changed;
}
function formatTime(seconds){
  seconds=Math.max(0,Math.ceil(seconds));
  const hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),secs=seconds%60;
  return [hours,minutes,secs].map(n=>String(n).padStart(2,'0')).join(':');
}
function formatMissionTime(seconds){
  seconds=Math.max(0,Math.ceil(seconds));
  const pad=n=>String(n).padStart(2,'0');
  if(seconds<60)return pad(seconds);
  if(seconds<3600)return pad(Math.floor(seconds/60))+':'+pad(seconds%60);
  if(seconds<=7200)return formatTime(seconds);
  const days=Math.floor(seconds/86400);
  const hours=Math.floor(seconds%86400/3600);
  const minutes=Math.floor(seconds%3600/60);
  return (days?days+'일 ':'')+pad(hours)+':'+pad(minutes);
}
function createCard(m){
  const card=document.createElement('article');
  card.className=m.selected?'mission':'mission pending';
  const row=document.createElement('div');
  row.className='mission-row';
  const info=document.createElement('div');
  info.className='mission-info';
  const name=document.createElement('span');
  name.className='mission-name';
  name.textContent=m.content;
  const style=document.createElement('span');
  style.className='mission-tag';
  style.dataset.style=m.type;
  style.textContent=m.type.endsWith('형')?m.type.slice(0,-1):m.type;
  style.setAttribute('aria-label',m.type);
  info.append(style,name);
  row.append(info);
  const time=document.createElement('span');
  const track=document.createElement('div');
  track.className='mission-track';
  track.setAttribute('role','progressbar');
  track.setAttribute('aria-label',m.selected?m.content+' '+m.type+' 진행률':'자동 수락 남은 시간');
  track.setAttribute('aria-valuemin','0');
  track.setAttribute('aria-valuemax',m.selected?'100':String(AUTO_ACCEPT));
  const fill=document.createElement('div');
  fill.className=m.selected?'mission-fill':'auto-fill';
  track.append(fill);
  if(m.selected){
    time.className='mission-time';
    row.append(time);
    card.append(row,track);
  }else{
    const button=document.createElement('button');
    button.type='button';
    button.className='mission-select';
    button.dataset.missionId=m.id;
    button.textContent='임무 선택';
    button.setAttribute('aria-label',m.content+' '+m.type+' 임무 선택');
    row.append(button);
    const autoRow=document.createElement('div');
    autoRow.className='auto-row';
    const label=document.createElement('span');
    label.className='auto-label';
    label.append('자동 수락 ',time);
    autoRow.append(track,label);
    card.append(row,autoRow);
  }
  return {card,selected:m.selected,fill,time,track};
}
function syncCards(){
  active.sort(missionOrder);
  const ids=new Set(active.map(m=>m.id));
  for(const [id,v] of views){
    if(!ids.has(id)){v.card.remove();views.delete(id)}
  }
  for(const m of active){
    let v=views.get(m.id);
    if(!v||v.selected!==m.selected){
      const next=createCard(m);
      if(v)v.card.replaceWith(next.card);
      views.set(m.id,next);
    }
  }
  active.forEach((m,i)=>{
    const card=views.get(m.id).card;
    if(list.children[i]!==card)list.insertBefore(card,list.children[i]||null);
  });
}
function animateBars(elapsed){
  for(const m of active){
    const v=views.get(m.id);
    if(!v)continue;
    const fraction=m.selected?clamp((elapsed-m.start)/m.duration):clamp((autoAt(m)-elapsed)/AUTO_ACCEPT);
    v.fill.style.transform='scaleX('+fraction+')';
    const remaining=Math.max(0,(m.selected?m.end:autoAt(m))-elapsed);
    const text=m.selected?formatMissionTime(remaining):formatTime(remaining);
    if(v.time.textContent!==text)v.time.textContent=text;
    const value=String(m.selected?Math.floor(fraction*100):Math.min(AUTO_ACCEPT,Math.ceil(remaining)));
    if(v.track.getAttribute('aria-valuenow')!==value)v.track.setAttribute('aria-valuenow',value);
  }
}
list.addEventListener('click',event=>{
  const button=event.target.closest('[data-mission-id]');
  if(!button||startedAt===null)return;
  const id=button.dataset.missionId;
  update();
  const mission=active.find(m=>m.id===id&&!m.selected);
  if(!mission)return;
  accept(mission,lastTick);
  syncCards();
  animateBars(Math.max(0,(performance.now()-startedAt)/1000));
  saveSession();
});
function update(){
  if(startedAt===null)return;
  const elapsed=Math.max(0,(performance.now()-startedAt)/1000);
  const tick=Math.floor(elapsed);
  if(tick!==lastTick){
    const first=lastTick<0;
    lastTick=tick;
    updateClock();
    let changed=false;
    // Only skip missions that would already have finished even with auto-accept.
    const horizon=AUTO_ACCEPT+MAX_DURATION;
    if(nextSpawn<=tick-horizon){
      nextSpawn+=Math.ceil((tick-horizon+1-nextSpawn)/SPAWN_INTERVAL)*SPAWN_INTERVAL;
      changed=true;
    }
    while(nextSpawn<=tick){
      const mission=spawn(nextSpawn);
      if(mission)active.push(mission);
      nextSpawn+=SPAWN_INTERVAL;
      changed=true;
    }
    changed=advanceObservation(tick)||changed;
    changed=advanceMissions(tick)||changed;
    if(first||changed)syncCards();
    if(changed)saveSession();
  }
  animateBars(elapsed);
}
function frame(){
  if(startedAt===null)return;
  update();
  window.requestAnimationFrame(frame);
}
function begin(saved){
  if(startedAt!==null)return;
  epoch=saved?saved.epoch:Date.now();
  const elapsed=saved?Math.max(saved.tick,Math.floor((Date.now()-epoch)/1000),0):0;
  startedAt=performance.now()-elapsed*1000;
  if(saved){
    // Accepted missions are immutable snapshots. Only offers use the new build.
    const sameBuild=saved.revision===BUILD_REVISION;
    active=saved.active.filter(m=>sameBuild||m.selected||m.pairedReturn===true||m.type==='관전형');
    const oldEnabled=new Set(Array.isArray(saved.enabled)?saved.enabled:[]);
    enabled=new Set(Array.from(oldEnabled).filter(key=>validKeys.has(key)));
    // Keep previously enabled observation categories when expanding their subtypes.
    for(const c of OBSERVATION){
      if(oldEnabled.has(JSON.stringify(['관전형',c.field,c.source])))enabled.add(c.key);
      if(!enabled.has(c.key))continue;
      const savedNext=saved.observationNext&&saved.observationNext[c.key];
      observationNext[c.key]=Number.isSafeInteger(savedNext)&&savedNext>=0?savedNext:elapsed;
    }
    nextSpawn=sameBuild?saved.nextSpawn:elapsed;
  }
  home.hidden=true;
  world.hidden=false;
  renderSettings();
  setPage('home',false);
  document.getElementById('clock').focus();
  update();
  saveSession();
  checkUpdate();
  window.setInterval(update,250);
  window.requestAnimationFrame(frame);
  window.setInterval(checkUpdate,UPDATE_INTERVAL);
}
start.addEventListener('click',()=>begin(readSession()));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)saveSession();
  else{update();checkUpdate(true)}
});
window.addEventListener('focus',()=>{if(!document.hidden)checkUpdate(true)});
window.addEventListener('online',()=>checkUpdate(true));
window.addEventListener('pagehide',()=>saveSession());
// Only a deliberate update application may resume directly once.
let resumeAfterUpdate=false, resumeScroll=0, resumeView=null;
try{
  const pending=sessionStorage.getItem(UPDATE_RESUME_KEY);
  resumeScroll=Math.max(0,Number(sessionStorage.getItem(UPDATE_SCROLL_KEY))||0);
  sessionStorage.removeItem(UPDATE_RESUME_KEY);
  sessionStorage.removeItem(UPDATE_SCROLL_KEY);
  const view=sessionStorage.getItem(UPDATE_VIEW_KEY);
  sessionStorage.removeItem(UPDATE_VIEW_KEY);
  try{resumeView=JSON.parse(view)}catch(error){resumeView=null}
  resumeAfterUpdate=!!pending&&pending===new URL(location.href).searchParams.get('update');
}catch(error){/* Ordinary loads always show the start screen. */}
if(resumeAfterUpdate){
  const previousSession=readSession();
  if(previousSession){
    begin(previousSession);
    if(resumeView&&resumeView.page==='play'){
      expandedStyle=TYPES.includes(resumeView.style)?resumeView.style:'';
      renderSettings();
      setPage('play',false);
    }
    window.requestAnimationFrame(()=>window.scrollTo(0,resumeScroll));
  }
}
</script>
